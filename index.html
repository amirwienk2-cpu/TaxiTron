<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Zombie Runner – PNG Auto Fix</title>
<style>
    body { margin: 0; overflow: hidden; background: #111; }
    #info {
        position: absolute; top: 10px; left: 10px;
        color: white; font-family: Arial; font-size: 18px;
    }
</style>
</head>
<body>

<div id="info">Coins: <span id="coins">0</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Szene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

// Kamera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

// Renderer
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Licht
const light = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(light);

// Straße
const roadGeometry = new THREE.BoxGeometry(10, 0.1, 200);
const roadMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
const road = new THREE.Mesh(roadGeometry, roadMaterial);
road.position.z = -100;
scene.add(road);

// AUTO PNG FIX
const loader = new THREE.TextureLoader();

// ❗❗ HIER DEIN PNG-NAME EINTRAGEN ❗❗
// Beispiel: 'meinAuto.png'
const carTexture = loader.load('meinAuto.png', () => {
    console.log("PNG geladen!");
}, undefined, () => {
    console.log("PNG konnte nicht geladen werden!");
});

const carGeometry = new THREE.BoxGeometry(1.5, 1, 3);
const carMaterial = new THREE.MeshBasicMaterial({ map: carTexture });
const car = new THREE.Mesh(carGeometry, carMaterial);
car.position.set(0, 0.5, 5);
scene.add(car);

// Zombies
let zombies = [];
function spawnZombie() {
    const geo = new THREE.BoxGeometry(1, 2, 1);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const zombie = new THREE.Mesh(geo, mat);
    zombie.position.set((Math.random() - 0.5) * 6, 1, -100);
    zombies.push(zombie);
    scene.add(zombie);
}
setInterval(spawnZombie, 800);

// Coins
let coins = 0;

// Steuerung
let lane = 0;
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && lane > -2) lane--;
    if (e.key === "ArrowRight" && lane < 2) lane++;
});

// Animation
function animate() {
    requestAnimationFrame(animate);

    car.position.x += (lane * 2 - car.position.x) * 0.1;

    zombies.forEach((z, i) => {
        z.position.z += 0.5;

        if (z.position.distanceTo(car.position) < 2) {
            coins += 10;
            document.getElementById("coins").innerText = coins;
            scene.remove(z);
            zombies.splice(i, 1);
        }
    });

    renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
