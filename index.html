<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Taxi Rush 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!--
      Rosebud defaults disable accidental selection, context menus, tap highlights,
      and native dragging during gameplay while preserving text editing. Most games
      need no customization.
    -->
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.184.0",
          "three/": "https://esm.sh/three@0.184.0/"
        }
      }
    </script>
    <style>
      :root { --yellow:#ffd21c; --ink:#10151f; --cyan:#43e6ef; }
      * { box-sizing:border-box; }
      html, body, #game-container { width:100%; height:100%; margin:0; padding:0; background:#87d9ed; overflow:hidden; }
      body { touch-action:none; font-family:Inter,system-ui,sans-serif; color:white; }
      canvas { display:block; }
      #ui-container { position:fixed; inset:0; z-index:10; pointer-events:none; padding:max(5vh,env(safe-area-inset-top)) max(3vw,env(safe-area-inset-right)) max(4vh,env(safe-area-inset-bottom)) max(3vw,env(safe-area-inset-left)); }
      .hud { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
      .stat { min-width:92px; padding:9px 14px; border:1px solid rgba(255,255,255,.26); border-radius:14px; background:rgba(11,18,29,.78); box-shadow:0 7px 20px rgba(0,0,0,.2); backdrop-filter:blur(8px); }
      .label { color:#9ec5d2; font-size:10px; font-weight:800; letter-spacing:1.5px; }
      .value { margin-top:2px; font:700 clamp(17px,4vw,25px)/1 Orbitron,sans-serif; }
      #coin-stat .value { color:var(--yellow); }
      .hud-actions { display:flex; gap:8px; pointer-events:auto; }
      .icon-btn { width:48px; height:48px; border:1px solid rgba(255,255,255,.3); border-radius:14px; color:white; background:rgba(11,18,29,.78); font-size:21px; box-shadow:0 7px 20px rgba(0,0,0,.2); }
      .icon-btn:active { transform:scale(.93); background:#263144; }
      #speed { position:absolute; right:max(3vw,env(safe-area-inset-right)); top:calc(max(5vh,env(safe-area-inset-top)) + 64px); font:700 11px Orbitron; color:#d9faff; text-shadow:0 2px 5px #000; }
      #toast { position:absolute; left:50%; top:26%; transform:translate(-50%,-15px) scale(.9); font:800 clamp(24px,7vw,50px) Orbitron; color:var(--yellow); text-shadow:0 4px 0 #131923,0 0 20px rgba(255,210,28,.6); opacity:0; transition:.18s; white-space:nowrap; }
      #toast.show { opacity:1; transform:translate(-50%,0) scale(1); }
      #swipe-hint { position:absolute; left:50%; bottom:8%; transform:translateX(-50%); padding:9px 15px; border-radius:99px; background:rgba(11,18,29,.64); font-size:12px; font-weight:700; letter-spacing:.4px; transition:.4s; }
      .screen { pointer-events:auto; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:8vh 6vw; background:linear-gradient(180deg,rgba(4,13,24,.12),rgba(4,13,24,.74)); transition:.25s; }
      .screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
      .panel { width:min(92vw,430px); padding:24px; text-align:center; border-radius:28px; background:rgba(12,19,30,.9); border:1px solid rgba(255,255,255,.2); box-shadow:0 24px 70px rgba(0,0,0,.38); backdrop-filter:blur(14px); }
      .logo { width:min(74vw,310px); max-height:150px; object-fit:contain; filter:drop-shadow(0 9px 12px rgba(0,0,0,.3)); }
      .tag { margin:0 0 18px; color:#b8d3dd; font-size:14px; }
      .primary { min-width:210px; min-height:56px; border:0; border-radius:17px; padding:0 24px; background:linear-gradient(135deg,#ffe22f,#ffae13); color:#15130a; font:800 17px Orbitron; box-shadow:0 7px 0 #b46a00,0 12px 24px rgba(255,183,0,.25); }
      .primary:active { transform:translateY(4px); box-shadow:0 3px 0 #b46a00; }
      .garage-label { margin:18px 0 9px; font-size:11px; letter-spacing:1.5px; font-weight:800; color:#8fb3c0; }
      .swatches { display:flex; justify-content:center; gap:13px; }
      .swatch { width:48px; height:48px; border-radius:50%; border:4px solid rgba(255,255,255,.2); background:var(--c); }
      .swatch.selected { border-color:white; box-shadow:0 0 0 3px var(--cyan); }
      #gameover h2 { margin:0 0 4px; font:800 30px Orbitron; }
      #final-score { margin:12px 0 4px; font:700 46px Orbitron; color:var(--yellow); }
      #record { min-height:22px; margin:0 0 20px; color:var(--cyan); font-weight:800; }
      @media (min-width:760px) { #swipe-hint::after { content:'  •  Pfeiltasten'; } }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="ui-container">
      <div class="hud">
        <div style="display:flex;gap:8px"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">00000</div></div><div class="stat" id="coin-stat"><div class="label">FAHRGELD</div><div class="value">⚡ <span id="coins">0</span></div></div></div>
        <div class="hud-actions"><button class="icon-btn" id="mute" aria-label="Ton">♫</button><button class="icon-btn" id="pause" aria-label="Pause">Ⅱ</button></div>
      </div>
      <div id="speed">60 KM/H</div><div id="toast">+100</div><div id="swipe-hint">↔ WISCHEN ZUM SPURWECHSEL</div>
      <div class="screen" id="menu"><div class="panel"><img class="logo" src="assets/taxi-runner-logo.webp" alt="Taxi Rush"><p class="tag">Coins schnappen. Verkehr meistern. Rekord knacken.</p><button class="primary" id="start">LOSFAHREN</button><div class="garage-label">DEIN TAXI</div><div class="swatches"><button class="swatch selected" data-color="#ffd21c" style="--c:#ffd21c" aria-label="Gelb"></button><button class="swatch" data-color="#30d6df" style="--c:#30d6df" aria-label="Cyan"></button><button class="swatch" data-color="#ff5777" style="--c:#ff5777" aria-label="Pink"></button></div></div></div>
      <div class="screen hidden" id="gameover"><div class="panel"><h2>FAHRT BEENDET</h2><div class="label">DEIN SCORE</div><div id="final-score">0</div><div id="record"></div><button class="primary" id="restart">NOCHMAL</button></div></div>
    </div>
    <script type="module" src="./main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ImageGenerator.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
  </body>
</html>
