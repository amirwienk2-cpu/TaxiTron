<style>
:root{
  --bg:#09090b; --bg2:#121215; --panel:#141417; --tile:#18181c; --hair:rgba(214,170,74,.22); --hair2:rgba(255,255,255,.06);
  --gold:#d6aa4a; --gold-hi:#f6dd8f; --gold-lo:#8d6214; --ivory:#efe9dd; --muted:#9b958a; --win:#f2cf6b; --lose:#8c8c94;
  --gold-grad:linear-gradient(180deg,#fff4c2 0%,#f3cf6a 24%,#c88f22 52%,#f0c457 74%,#8a5a10 100%);
  --num:"Montserrat",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:#09090b}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(90% 50% at 50% -10%,rgba(214,170,74,.14),transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg) 40%);
  background-attachment:fixed;color:var(--ivory);font-family:"Vazirmatn",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html[lang=de] body{font-family:"Montserrat","Vazirmatn",system-ui,sans-serif}
.app{max-width:500px;margin:0 auto;padding:14px 16px 22px;display:flex;flex-direction:column;gap:14px}

/* ---------- Kopf ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-2px}
.people{font-size:13px;color:var(--muted);border:1px solid var(--hair2);border-radius:999px;padding:5px 12px;white-space:nowrap}
.people b{color:var(--ivory);font-family:var(--num);font-weight:700}

/* ---------- Bühne ---------- */
.stage{position:relative;border-radius:26px;padding:16px 14px 14px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#1d1a14 0,#121215 55%,#0d0d10 100%);
  border:1px solid var(--hair);box-shadow:0 20px 40px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 35% at 50% 32%,rgba(246,221,143,.10),transparent 70%);pointer-events:none}
.stageHead{position:relative;height:132px;display:grid;place-items:center;text-align:center}
.idle small{display:block;font-size:13px;color:var(--muted);letter-spacing:.3px}
.idle strong{display:block;font-family:var(--num);font-size:52px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;direction:ltr;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.idle .sub{font-size:12px;color:var(--muted);margin-top:4px}
.idle .sub b{color:var(--gold);font-family:var(--num);font-weight:700}
.stateTag{display:inline-block;margin-top:2px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--hair);color:var(--gold)}
.stateTag.closed{color:#ffb4a0;border-color:rgba(255,140,110,.35)}
.bigWrap{position:absolute;inset:0;display:grid;place-items:center}
.bigWrap .ball{--s:118px}
.bigWrap .ball.enter{animation:bigIn .6s cubic-bezier(.2,1.25,.4,1)}
@keyframes bigIn{from{transform:translateY(-70px) rotate(-200deg) scale(.5);opacity:0}}
.bigWrap .ball.leave{transition:transform .45s ease-in,opacity .45s;transform:translateY(60px) scale(.35);opacity:0}

.row{display:flex;justify-content:center;gap:6px;direction:ltr;margin-top:10px}
.slot{width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 50% 40%,#0b0b0d,#17171b);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 0 0 1px rgba(214,170,74,.18),0 1px 0 rgba(255,255,255,.04)}
.row .ball{--s:46px}
.row .ball.pop{animation:slotIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes slotIn{from{transform:scale(.3);opacity:0}}
.row.past .ball{filter:saturate(.75) brightness(.85)}
.rowLabel{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

.ball span{position:absolute;left:50.4%;top:49.6%;transform:translate(-50%,-52%);font-family:var(--num);font-weight:800;line-height:1;
  font-size:calc(var(--s)*.37);letter-spacing:-.02em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:calc(var(--s)*.004) rgba(110,70,8,.55);
  filter:drop-shadow(0 calc(var(--s)*-.006) 0 rgba(255,244,200,.55)) drop-shadow(0 calc(var(--s)*.014) 0 #4a3004) drop-shadow(0 calc(var(--s)*.02) calc(var(--s)*.03) rgba(0,0,0,.75))}
.ball.d2 span{font-size:calc(var(--s)*.28);letter-spacing:-.03em}

/* Tipp-Leiste */
.ticket{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair2)}
.ticket > span{font-size:12px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:5px;direction:ltr}
.chipN{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:13px;color:var(--ivory);
  background:radial-gradient(circle at 40% 30%,#26262b,#0e0e11);box-shadow:inset 0 0 0 1.5px rgba(214,170,74,.45)}
.chipN.hit{color:#1a1206;background:var(--gold-grad);box-shadow:0 0 12px rgba(246,212,110,.6)}

/* ---------- Zahlenfeld ---------- */
.pickHead{display:flex;justify-content:space-between;align-items:center}
.pickHead h2{margin:0;font-size:16px;font-weight:700}
.counter{font-size:13px;color:var(--muted)}
.counter b{font-family:var(--num);color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;direction:ltr}
.num{aspect-ratio:1;border:1px solid var(--hair2);border-radius:50%;background:radial-gradient(circle at 50% 35%,#1f1f24,#141417);
  color:var(--ivory);font:600 16px var(--num);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .1s,box-shadow .15s,background .15s}
.num:active:not(:disabled){transform:scale(.9)}
.num.on{border-color:transparent;background:radial-gradient(circle at 45% 30%,#2a2a2f,#09090b 70%);
  box-shadow:inset 0 0 0 2px #c8962e,0 0 0 1px rgba(246,212,110,.25),0 4px 10px rgba(0,0,0,.5)}
.num.on span{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.num.hit{box-shadow:inset 0 0 0 2px #f6dd8f,0 0 16px rgba(246,212,110,.7)}
.grid.locked .num:not(.on){opacity:.3}
.num:disabled{cursor:default}
.num:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border-radius:16px;padding:12px 8px;font:700 15px "Vazirmatn","Montserrat",sans-serif;cursor:pointer;color:var(--ivory);
  background:transparent;border:1px solid var(--hair);transition:transform .08s,opacity .15s,background .15s}
html[lang=de] .btn{font-family:"Montserrat","Vazirmatn",sans-serif}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.main{grid-column:1/-1;border:0;padding:15px 8px;font-size:17px;font-weight:800;color:#1a1206;
  background:linear-gradient(180deg,#f7dc8a,#d6aa4a 55%,#b0801f);box-shadow:0 8px 20px -8px rgba(214,170,74,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.main:disabled{opacity:1;background:#1b1b1f;color:var(--muted);box-shadow:inset 0 0 0 1px var(--hair2);font-size:14px;font-weight:600}
#rBack{display:block;width:100%;margin-top:10px;font-size:13px;padding:10px 8px}

/* Gewinntabelle */
.table{border:1px solid var(--hair2);border-radius:18px;overflow:hidden}
.table h3{margin:0;padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--hair2)}
.tr{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:14px}
.tr + .tr{border-top:1px solid var(--hair2)}
.tr .dots{display:flex;gap:3px;direction:ltr}
.tr .dots i{width:7px;height:7px;border-radius:50%;background:#2a2a30}
.tr .dots i.f{background:var(--gold)}
.tr b{font-family:var(--num);font-weight:700;direction:ltr;unicode-bidi:isolate}
.tr.jack b{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:16px;font-weight:800}

/* Tippliste aller Spieler */
.players{border:1px solid var(--hair2);border-radius:18px;overflow:hidden}
.players h3{margin:0;padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--hair2);display:flex;justify-content:space-between}
.players h3 b{font-family:var(--num);color:var(--ivory)}
.plist{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto;overscroll-behavior:contain}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
.pl + .pl{border-top:1px solid var(--hair2)}
.pl.me{background:rgba(214,170,74,.07)}
.pn{min-width:0;display:flex;flex-direction:column;gap:2px}
.pn b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pl.me .pn b{color:var(--gold)}
.pn small{font-size:11px;color:var(--muted);direction:ltr;unicode-bidi:isolate;text-align:start}
.pn small.m{color:var(--ivory)}
.pn small.w{font-family:var(--num);font-weight:800;font-size:12px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips.sm{gap:4px}
.chips.sm .chipN{width:26px;height:26px;font-size:11px}
.pl.win{background:linear-gradient(90deg,rgba(214,170,74,.12),transparent)}
.empty{padding:14px;text-align:center;font-size:13px;color:var(--muted)}
.card .players{margin:14px 0 0;text-align:start}
.card .plist{max-height:200px}
.card .players h3,.card.won .players h3{margin:0;font-size:13px;font-weight:700;background:none;color:var(--muted);-webkit-text-fill-color:currentColor}

.banner{text-align:center;font-size:12px;color:var(--muted)}

/* ---------- Ergebnis ---------- */
.result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,5,7,.82);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s;overflow:auto}
.result.show{opacity:1;pointer-events:auto}
.card{width:min(360px,100%);text-align:center;padding:22px 18px 18px;border-radius:28px;position:relative;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#221d12 0,#141417 55%,#0e0e11 100%);border:1px solid var(--hair);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.9);transform:translateY(16px) scale(.96);transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.result.show .card{transform:none}
.card.lose{background:linear-gradient(180deg,#17171a,#0e0e11);border-color:var(--hair2)}
.card .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.3px}
.card h3{margin:2px 0 4px;font-size:26px;font-weight:800}
.card.won h3{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .matches{font-size:14px;color:var(--muted)}
.card .amount{font-family:var(--num);font-size:40px;font-weight:800;line-height:1.15;margin-top:6px;direction:ltr;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .note{font-size:12px;color:var(--muted);margin-top:2px}
.card .row{margin:16px 0 4px}
.card .row .ball{--s:44px}
.sum{margin:14px 0 0;border:1px solid var(--hair2);border-radius:16px;padding:10px 8px}
.sum h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.sum h4 b{color:var(--ivory);font-family:var(--num)}
.sumRow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sumItem{border-radius:10px;padding:5px 0;opacity:.45}
.sumItem.has{opacity:1}
.sumItem.me{background:rgba(214,170,74,.12);box-shadow:inset 0 0 0 1px rgba(214,170,74,.5)}
.sumItem small{display:block;font-size:11px;color:var(--muted)}
.sumItem b{display:block;font-family:var(--num);font-size:16px;direction:ltr}
.card .btn.main{width:100%}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:#f3e3b8;color:#1a1206;font-weight:700;font-size:14px;
  padding:9px 16px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.bigWrap .ball.enter,.row .ball.pop{animation:none}}
</style>
</head>

       plNow:"بلیت‌های این دور", plLast:"نتایج قرعه‌کشی قبلی", plEmpty:"هنوز کسی بلیت ثبت نکرده – اولین نفر باش!",
       winners:"برنده‌ها", noWinners:"این دور کسی برنده نشد", you:"(تو)",
       err:{ closed:"مهلت ثبت تموم شد", already:"برای این قرعه‌کشی بلیت داری", invalid:"باید دقیقاً ۶ عدد انتخاب کنی",
             auth:"لطفاً برنامه رو از تلگرام باز کن", server:"اتصال برقرار نشد. دوباره امتحان کن" } },
  de:{ title:"Lotto", subtitle:n=>`6 aus ${n} – kostenlos`, pick:n=>`Wähle ${n} Zahlen`, picked:(a,b)=>`<b>${a}</b> von <b>${b}</b>`,
       quick:"Zufallstipp", clear:"Löschen", submit:"Tipp abgeben", needMore:n=>`Noch ${n} Zahlen wählen`,
       submitted:"Tipp abgegeben – warte auf die Ziehung", closed:"Annahmeschluss", drawing:"Ziehung läuft",
       nextDraw:"Nächste Ziehung", tagOpen:"Tippabgabe offen", tagClosed:"Annahmeschluss", people:"Tipps",
       lastDraw:"Zahlen der letzten Ziehung", noDraw:"Noch keine Ziehung", drawn:n=>`Zahl ${n} von 6`, nowDraw:"Gewinnzahlen",
       yourTicket:"Dein Tipp", matches:n=>`${n} Richtige`, right:"Richtige", table:"Gewinntabelle",
       won:"Glückwunsch! Gewonnen", noWin:"Diesmal leider nicht", noTicket:"Du hattest bei dieser Ziehung keinen Tipp", credited:"Wurde deiner Balance gutgeschrieben",
       demo:"Demo-Modus – nichts wird gutgeschrieben", ok:"Weiter", result:"Ergebnis der Ziehung", back:"Zurück zum Chat",
       sumTitle:n=>`Teilnehmer: <b>${n}</b>`, nobody:"Niemand hat getippt",
       plNow:"Tipps dieser Runde", plLast:"Ergebnis der letzten Ziehung", plEmpty:"Noch kein Tipp – sei der Erste!",
       winners:"Gewinner", noWinners:"Diesmal hat niemand gewonnen", you:"(du)",
       err:{ closed:"Annahmeschluss ist vorbei", already:"Du hast schon getippt", invalid:"Bitte genau 6 Zahlen wählen",
             auth:"Bitte die App über Telegram öffnen", server:"Verbindung fehlgeschlagen. Versuch es nochmal." } }
};

const API = "/api/lotto";
const tg = window.Telegram && window.Telegram.WebApp;
try { tg && tg.ready(); tg && tg.expand(); tg && tg.setHeaderColor && tg.setHeaderColor("#121215"); tg && tg.setBackgroundColor && tg.setBackgroundColor("#09090b"); } catch(e){}
const initData = (tg && tg.initData) || "";
const LANG = new URLSearchParams(location.search).get("lang") === "de" ? "de" : "fa";
const L = T[LANG];
document.documentElement.lang = LANG;
document.documentElement.dir = LANG === "fa" ? "rtl" : "ltr";
const HDR = () => ({ "X-Telegram-Init-Data": initData });
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const haptic = (k, v) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[k](v); } catch(e){} };
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400); }

let demo = !initData;
let everyMs = 600000, closeMs = 30000, anchor = 0, offset = 0;
let selected = new Set();
let myTicket = null, ticketDraw = -1;
let participants = 0, demoPeople = 0;
let drawing = false, busy = false;
let lastShown = null;
let seenDraw = -1, finishedDraw = -1;
let players = [];          // Tipps der aktuellen Runde (alle User)
let demoPlayers = [];

const now = () => Date.now() + offset;
const drawId = () => Math.floor((now() - anchor) / everyMs);
const drawAtMs = id => anchor + (id + 1) * everyMs;
const isOpen = () => now() < drawAtMs(drawId()) - closeMs;
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const amountText = p => p.currency === "TON" ? `${p.amount} TON` : `${p.amount.toLocaleString("en-US")} TT`;

const ballHTML = (n, cls = "") => `<div class="ball ${n>9?"d2":""} ${cls}"><span>${n}</span></div>`;
const slotHTML = () => `<div class="slot"></div>`;
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function playerRow(p, drawn, final){
  let info = "";
  if (drawn) {
    const m = p.matches != null && final ? p.matches : p.numbers.filter(n => drawn.has(n)).length;
    info = final && p.prize ? `<small class="w">+${amountText(p.prize)}</small>` : `<small class="m">${m} ${L.right}</small>`;
  }
  return `<li class="pl ${p.me?"me":""} ${final&&p.prize?"win":""}"><div class="pn"><b>${esc(p.name)}${p.me?" "+L.you:""}</b>${info}</div>`+
    `<div class="chips sm">${p.numbers.map(n=>chipHTML(n, !!(drawn && drawn.has(n)))).join("")}</div></li>`;
}
function renderPlayers(list, drawn, final, title){
  $("plTitle").textContent = title;
  $("plCount").innerHTML = list.length ? `<b>${list.length}</b>` : "";
  $("plist").innerHTML = list.length ? list.map(p=>playerRow(p, drawn, final)).join("") : `<li class="empty">${L.plEmpty}</li>`;
}
let plKey = "";
function renderIdlePlayers(){
  let list, title, drawn = null, final = false;
  if (players.length || !(lastShown && lastShown.players && lastShown.players.length)) { list = players; title = L.plNow; }
  else { list = lastShown.players; title = L.plLast; drawn = new Set(lastShown.numbers); final = true; }
  const k = title + JSON.stringify(list.map(p=>[p.name,p.numbers.join(".")]));
  if (k === plKey) return; plKey = k;
  renderPlayers(list, drawn, final, title);
}
const chipHTML = (n, hit) => `<div class="chipN ${hit?"hit":""}">${n}</div>`;

/* ---------- Aufbau ---------- */
function buildGrid(){
  const g = $("grid"); g.innerHTML = "";
  for (let n = 1; n <= MAX; n++){
    const b = document.createElement("button");
    b.className = "num"; b.innerHTML = `<span>${n}</span>`; b.dataset.n = n;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => toggle(n));
    g.appendChild(b);
  }
}
function renderStatic(){
  $("title").textContent = L.title; $("subtitle").textContent = L.subtitle(MAX);
  $("pickTitle").textContent = L.pick(PICK);
  $("quickBtn").textContent = L.quick; $("clearBtn").textContent = L.clear;
  $("tableTitle").textContent = L.table;
  const keys = Object.keys(PRIZES).map(Number).sort((a,b)=>b-a);
  $("prizes").innerHTML = keys.map((k,i) => {
    const dots = Array.from({length:PICK},(_,j)=>`<i class="${j<k?"f":""}"></i>`).join("");
    return `<div class="tr ${i===0?"jack":""}"><span>${k} ${L.right}</span><span class="dots">${dots}</span><b>${amountText(PRIZES[k])}</b></div>`;
  }).join("");
}

/* ---------- Auswahl ---------- */
function canEdit(){ return !drawing && isOpen() && ticketDraw !== drawId(); }
function toggle(n){
  if (!canEdit()) return;
  if (selected.has(n)) selected.delete(n);
  else { if (selected.size >= PICK) { haptic("notificationOccurred","warning"); return; } selected.add(n); }
  haptic("selectionChanged");
  renderGrid(); updateUI(true);
}
function renderGrid(hits){
  const locked = !canEdit();
  $("grid").classList.toggle("locked", locked && selected.size > 0);
  for (const b of $("grid").children){
    const n = +b.dataset.n, on = selected.has(n);
    b.classList.toggle("on", on);
    b.classList.toggle("hit", !!(hits && on && hits.has(n)));
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.disabled = locked;
  }
}
$("quickBtn").onclick = () => {
  if (!canEdit()) return;
  const pool = Array.from({length:MAX}, (_,i)=>i+1);
  for (let i = pool.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  selected = new Set(pool.slice(0, PICK)); haptic("impactOccurred","light");
  renderGrid(); updateUI(true);
};
$("clearBtn").onclick = () => { if (!canEdit()) return; selected.clear(); renderGrid(); updateUI(true); };

/* ---------- Tipp abgeben ---------- */
$("submitBtn").onclick = async () => {
  if (busy || !canEdit() || selected.size !== PICK) return;
  busy = true; updateUI(true);
  const nums = [...selected].sort((a,b)=>a-b);
  try {
    if (demo) { await sleep(300); demoPlayers.unshift({ name:"شما", numbers: nums, me:true }); demoPeople = demoPlayers.length; players = demoPlayers.slice(); }
    else {
      const r = await fetch(API + "/ticket", { method:"POST", headers:{ "Content-Type":"application/json", ...HDR() }, body: JSON.stringify({ numbers: nums }) });
      const j = await r.json().catch(()=>({ error:"server" }));
      if (!r.ok) throw j;
      participants = j.participants;
      setTimeout(loadState, 300);
    }
    myTicket = nums; ticketDraw = drawId();
    haptic("notificationOccurred","success");
  } catch(e) {
    const c = (e && e.error) || "server";
    if (c === "already") ticketDraw = drawId();
    toast(L.err[c] || L.err.server);
  } finally { busy = false; renderGrid(); updateUI(true); }
};

/* ---------- Status ---------- */
async function loadState(){
  if (demo) return;
  try {
    const t0 = Date.now();
    const r = await fetch(API + "/state", { headers: HDR() });
    if (!r.ok) throw new Error("state " + r.status);
    const j = await r.json();
    offset = j.serverNow - Math.round((t0 + Date.now())/2);
    everyMs = j.everyMs; closeMs = j.closeMs; anchor = 0;
    if (j.numbers !== MAX || j.pick !== PICK) { MAX = j.numbers; PICK = j.pick; buildGrid(); }
    if (j.prizes) PRIZES = j.prizes;
    renderStatic();
    participants = j.participants || 0;
    if (!drawing) players = j.players || [];
    if (j.myTicket) { myTicket = j.myTicket; ticketDraw = j.drawId; selected = new Set(j.myTicket); }
    if (j.last && j.last.numbers && !drawing && (!lastShown || lastShown.drawId < j.last.drawId)) lastShown = j.last;
    loadState.ok = true;
  } catch(e) { console.warn(e); if (!loadState.ok) startDemo(); }
  renderGrid(); updateUI(true);
}
const DEMO_NAMES = ["علی","سارا","رضا","مریم","امیر","نگار","حسین","زهرا","مهدی","پریسا","محمد","الهام","سینا","نازنین","کامران","لیلا","بهزاد","شیما","آرش","تینا","پویا","مینا","فرهاد","ستاره","یاسین","هانیه","Omid","Navid","Shayan","Roya"];
function randTicket(){ const pool = Array.from({length:MAX},(_,i)=>i+1); for (let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; } return pool.slice(0,PICK).sort((a,b)=>a-b); }
function addDemoPlayer(){
  const name = DEMO_NAMES[demoPlayers.length % DEMO_NAMES.length] + (demoPlayers.length >= DEMO_NAMES.length ? " " + (demoPlayers.length+1) : "");
  demoPlayers.push({ name, numbers: randTicket(), me:false }); demoPeople = demoPlayers.length; players = demoPlayers.slice();
}
function startDemo(){
  demo = true; offset = 0; closeMs = 5000;
  anchor = Date.now() + 25000 - everyMs; // erste Ziehung in 25 s
  demoPeople = 0; for (let i = 0, n = 14 + Math.floor(Math.random()*10); i < n; i++) addDemoPlayer();
  $("banner").textContent = L.demo; $("banner").hidden = false;
}

let uiKey = "", rowKey = "";
function updateUI(force){
  const id = drawId(), t = now();
  if (!drawing) seenDraw = id;
  const toDraw = drawAtMs(id) - t, open = toDraw - closeMs > 0;
  $("people").innerHTML = `<b>${demo ? demoPeople : participants}</b> ${L.people}`;

  if (!drawing) {
    $("idle").hidden = false; $("bigWrap").hidden = true;
    $("idleLabel").textContent = L.nextDraw;
    $("idleTime").textContent = fmt(toDraw);
    const tag = $("stateTag");
    tag.textContent = open ? L.tagOpen : L.tagClosed;
    tag.classList.toggle("closed", !open);
    const nums = lastShown ? lastShown.numbers : null;
    const k = nums ? nums.join(",") : "-";
    if (force || rowKey !== k) {
      rowKey = k;
      $("drawRow").className = "row" + (nums ? " past" : "");
      $("drawRow").innerHTML = nums ? nums.map(n=>ballHTML(n)).join("") : Array.from({length:PICK}, slotHTML).join("");
      $("rowLabel").textContent = nums ? L.lastDraw : L.noDraw;
    }
    renderIdlePlayers();
    const has = ticketDraw === id && myTicket;
    $("ticket").hidden = !has;
    if (has) {
      $("ticketLabel").textContent = L.yourTicket;
      const tk = myTicket.join(",");
      if ($("ticketChips").dataset.k !== tk) { $("ticketChips").dataset.k = tk; $("ticketChips").innerHTML = myTicket.map(n=>chipHTML(n)).join(""); }
    }
  }

  $("pickCount").innerHTML = L.picked(selected.size, PICK);
  const edit = canEdit();
  $("quickBtn").disabled = !edit; $("clearBtn").disabled = !edit || !selected.size;

  let text, dis = true;
  if (drawing) text = L.drawing + " …";
  else if (ticketDraw === id) text = L.submitted;
  else if (!open) text = L.closed;
  else if (selected.size < PICK) text = L.needMore(PICK - selected.size);
  else { text = L.submit; dis = busy; }
  const key = text + dis;
  if (force || key !== uiKey) { uiKey = key; $("submitBtn").textContent = text; $("submitBtn").disabled = dis; }
  if (force || edit !== updateUI._edit) { updateUI._edit = edit; renderGrid(); }
}

/* ---------- Ziehung ---------- */
function demoResult(id){
  const numbers = randTicket().sort(()=>Math.random()-.5), set = new Set(numbers);
  const counts = {}; for (let m=0;m<=PICK;m++) counts[m]=0;
  const list = demoPlayers.map(p => { const m = p.numbers.filter(n=>set.has(n)).length; counts[m]++; return { ...p, matches:m, prize: PRIZES[m] || null }; })
    .sort((a,b)=> b.matches - a.matches || (b.me - a.me));
  const mine = list.find(p=>p.me);
  return { drawId:id, numbers, ticket: mine ? mine.numbers : null, matches: mine ? mine.matches : null, prize: mine ? mine.prize : null,
           participants: list.length, counts, players: list };
}

async function fetchResult(id){
  if (demo) { await sleep(500); return demoResult(id); }
  for (let i=0;i<15;i++){
    await sleep(i ? 1000 : 600);
    try {
      const r = await fetch(`${API}/result?drawId=${id}`, { headers: HDR() });
      if (r.status === 425) continue;
      if (!r.ok) throw new Error("result " + r.status);
      return await r.json();
    } catch(e) { console.warn(e); }
  }
  throw new Error("no result");
}

async function runDraw(id){
  drawing = true; updateUI(true);
  const ticket = ticketDraw === id ? myTicket : null;
  $("idle").hidden = true; const big = $("bigWrap"); big.hidden = false; big.innerHTML = "";
  $("drawRow").className = "row"; rowKey = "draw";
  $("drawRow").innerHTML = Array.from({length:PICK}, slotHTML).join("");
  $("rowLabel").textContent = L.drawing + " …";
  $("ticket").hidden = !ticket;
  if (ticket) { $("ticketChips").dataset.k = ""; $("ticketChips").innerHTML = ticket.map(n=>chipHTML(n)).join(""); }

  let res;
  try { res = await fetchResult(id); }
  catch(e) { drawing = false; toast(L.err.server); updateUI(true); return; }

  const hits = new Set();
  const nums = res.numbers || [];
  const plist = res.players || [];
  const drawnSet = new Set();
  plKey = ""; renderPlayers(plist, drawnSet, false, L.plNow);
  for (let i=0;i<nums.length;i++){
    const n = nums[i], hit = !!(ticket && ticket.includes(n));
    $("rowLabel").textContent = L.drawn(i+1);
    big.innerHTML = ballHTML(n, "enter" + (hit ? " hit" : ""));
    haptic("impactOccurred", "medium");
    await sleep(1300);
    const bb = big.firstElementChild; bb.classList.remove("enter"); bb.classList.add("leave");
    await sleep(380);
    $("drawRow").children[i].outerHTML = ballHTML(n, "pop" + (hit ? " hit" : ""));
    drawnSet.add(n); renderPlayers(plist, drawnSet, false, L.plNow);
    if (hit) {
      hits.add(n); haptic("notificationOccurred", "success");
      const c = [...$("ticketChips").children].find(x => +x.textContent === n); c && c.classList.add("hit");
      renderGrid(hits);
    }
    await sleep(350);
  }
  big.innerHTML = "";
  $("rowLabel").textContent = L.nowDraw;
  renderPlayers(plist, drawnSet, true, L.plLast);
  await sleep(900);
  showResult(res, () => {
    lastShown = res; drawing = false; rowKey = ""; plKey = "";
    if (demo) { demoPlayers = []; players = []; for (let i=0,n=3+Math.floor(Math.random()*5);i<n;i++) addDemoPlayer(); } else players = [];
    if (ticket) selected = new Set(ticket);
    renderGrid(); updateUI(true);
    if (!demo) loadState();
  });
}

function showResult(res, onClose){
  const card = $("card");
  const won = !!res.prize;
  card.classList.toggle("won", won);
  card.classList.toggle("lose", !won);
  $("rEyebrow").textContent = L.result;
  if (res.matches == null) {
    $("rTitle").textContent = L.nowDraw; $("rMatches").textContent = L.noTicket;
    $("rAmount").textContent = ""; $("rNote").textContent = "";
  } else {
    $("rTitle").textContent = won ? L.won : L.noWin;
    $("rMatches").textContent = L.matches(res.matches);
    $("rAmount").textContent = won ? "+" + amountText(res.prize) : "";
    $("rNote").textContent = won ? (demo ? L.demo : L.credited) : "";
  }
  const tset = new Set(res.ticket || []);
  $("rBalls").innerHTML = (res.numbers || []).map(n => ballHTML(n, tset.has(n) ? "hit" : "")).join("");
  const total = res.participants || 0;
  $("sumTitle").innerHTML = total ? L.sumTitle(total) : L.nobody;
  const keys = Object.keys(PRIZES).map(Number).sort((a,b)=>a-b);
  $("sumRow").hidden = !total;
  $("sumRow").innerHTML = keys.map(k => {
    const c = (res.counts && res.counts[k]) || 0;
    return `<div class="sumItem ${c?"has":""} ${res.matches===k?"me":""}"><small>${k} ${L.right}</small><b>×${c}</b></div>`;
  }).join("");
  const winners = (res.players || []).filter(p => p.prize);
  $("winBox").hidden = !total;
  $("winTitle").textContent = L.winners;
  $("winCount").innerHTML = winners.length ? `<b>${winners.length}</b>` : "";
  const ws = new Set(res.numbers || []);
  $("winList").innerHTML = winners.length ? winners.map(p=>playerRow(p, ws, true)).join("") : `<li class="empty">${L.noWinners}</li>`;
  $("rOk").textContent = L.ok;
  $("rBack").textContent = L.back;
  $("result").classList.add("show");
  setTimeout(()=>$("rOk").focus(), 50);
  $("rOk").onclick = () => { $("result").classList.remove("show"); onClose(); };
  $("rBack").onclick = () => { location.href = "/TaxiTonUpdate/indexup.html#chat"; };
}

/* ---------- Takt ---------- */
function loop(){
  const id = drawId();
  if (!drawing && seenDraw >= 0 && id > seenDraw && finishedDraw < seenDraw) { finishedDraw = seenDraw; runDraw(seenDraw); }
  if (demo && isOpen() && Math.random() < 0.02) addDemoPlayer();
  updateUI(false);
}

buildGrid(); renderStatic();
(demo ? Promise.resolve(startDemo()) : loadState()).then(() => { updateUI(true); setInterval(loop, 250); });
setInterval(() => { if (!demo && !drawing) loadState(); }, 20000);
})();
</script>
</body>
</html>
