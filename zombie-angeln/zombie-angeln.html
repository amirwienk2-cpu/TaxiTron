<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ماهیگیری بچه زامبی</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#13282b; --water-top:#1f5552; --water-deep:#0a1c21;
  --slime:#8be05a; --brain:#ff6fa3; --paci:#3d8fe0; --ink:#eaf7e4; --ink-dim:#a9c4b6;
  --font:"Baloo 2","Vazirmatn",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--water-deep);color:var(--ink);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
html[lang=fa] body{font-family:"Vazirmatn","Baloo 2",system-ui,sans-serif}
.app{height:100%;display:grid;grid-template-rows:1fr auto;max-width:520px;margin:0 auto}

/* ---------- pond ---------- */
.pond{position:relative;overflow:hidden;
  background:
    linear-gradient(180deg,var(--night) 0%,var(--night) var(--surface),var(--water-top) var(--surface),#143a3c 55%,var(--water-deep) 100%);
  --surface:20%}
.pond::after{content:"";position:absolute;inset:auto 0 0 0;height:18%;
  background:radial-gradient(60% 100% at 30% 100%,#0c2a22 0,transparent 70%),radial-gradient(50% 90% at 80% 100%,#0e2f26 0,transparent 70%);pointer-events:none}
.wave{position:absolute;left:0;width:200%;height:14px;top:calc(var(--surface) - 7px);
  animation:drift 9s linear infinite;opacity:.9}
@keyframes drift{to{transform:translateX(-50%)}}

.status{position:absolute;top:10px;inset-inline:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:5;font-size:14px}
.pill{background:rgba(10,28,33,.75);border:1px solid rgba(139,224,90,.25);border-radius:999px;padding:3px 12px;font-weight:600;white-space:nowrap}
.pill b{font-weight:800;color:var(--slime);font-variant-numeric:tabular-nums}

.rod{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.hook{position:absolute;width:18px;height:26px;margin:-4px 0 0 -9px;z-index:4;pointer-events:none}

.baby{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;z-index:2;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.baby img{display:block;width:100%;height:100%;object-fit:contain}
.baby.hooked{z-index:6}

.countdown{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1;pointer-events:none;transition:opacity .4s}
.countdown small{display:block;font-size:16px;color:var(--ink-dim);font-weight:600}
.countdown strong{display:block;font-size:64px;line-height:1;font-weight:800;color:var(--slime);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(139,224,90,.35)}
.countdown.hide{opacity:0}

.splash{position:absolute;width:60px;height:14px;margin:-7px 0 0 -30px;border:2px solid rgba(234,247,228,.7);border-radius:50%;
  animation:ring .7s ease-out forwards;pointer-events:none;z-index:3}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.bubble{position:absolute;width:6px;height:6px;border-radius:50%;border:1px solid rgba(234,247,228,.4);animation:rise linear forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-140px);opacity:0}}

.banner{position:absolute;bottom:10px;inset-inline:12px;z-index:5;text-align:center;font-size:13px;color:var(--ink-dim);
  background:rgba(10,28,33,.8);border-radius:10px;padding:5px 8px}

/* ---------- bottom ---------- */
.dock{padding:10px 14px 14px;background:var(--water-deep);border-top:2px solid #0f2e2a}
.fishReturn{display:block;width:100%;border:1px solid rgba(234,247,228,.25);border-radius:12px;padding:9px 10px;margin-bottom:10px;
  font:700 14px var(--font);color:var(--ink);background:rgba(10,28,33,.55);cursor:pointer}
html[lang=fa] .fishReturn{font-family:"Vazirmatn",sans-serif}
.fishReturn:active{background:rgba(10,28,33,.8)}
.prizes{display:flex;justify-content:space-between;gap:4px;margin-bottom:12px}
.prize{flex:1;text-align:center;min-width:0}
.prize img{height:46px;width:100%;object-fit:contain;display:block}
.prize span{display:block;direction:ltr;unicode-bidi:isolate;font-size:12px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.prize.ton span{color:var(--paci)}
.cast{width:100%;border:0;border-radius:18px;padding:14px 10px;font:800 20px var(--font);color:#0d2410;
  background:var(--slime);box-shadow:0 5px 0 #4f9a2c;cursor:pointer;transition:transform .08s,box-shadow .08s}
html[lang=fa] .cast{font-family:"Vazirmatn",sans-serif}
.cast:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #4f9a2c}
.cast:disabled{background:#24423d;color:var(--ink-dim);box-shadow:0 5px 0 #17302c;cursor:default;font-size:16px}
.cast:focus-visible{outline:3px solid var(--brain);outline-offset:3px}

/* ---------- result ---------- */
.result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;
  background:rgba(6,16,18,.78);opacity:0;pointer-events:none;transition:opacity .25s}
.result.show{opacity:1;pointer-events:auto}
.card{width:min(340px,100%);text-align:center;padding:18px 18px 20px;border-radius:28px;
  background:radial-gradient(120% 70% at 50% 30%,#2b6b4f 0,#123331 60%,#0c2226 100%);
  border:2px solid rgba(139,224,90,.4);transform:scale(.85);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.result.show .card{transform:scale(1)}
.card h2{margin:0;font-size:22px;font-weight:800;color:var(--ink-dim)}
.card img{width:200px;height:200px;object-fit:contain;margin:6px auto 0;display:block;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.card .amount{font-size:46px;font-weight:800;line-height:1.1;color:var(--slime);font-variant-numeric:tabular-nums;direction:ltr}
.card.ton .amount{color:var(--paci)}
.card p{margin:4px 0 10px;font-size:14px;color:var(--ink-dim)}
.card .cast{font-size:18px}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:30;background:var(--brain);color:#2a0716;
  font-weight:800;padding:8px 16px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}


.sum{margin:4px 0 16px;padding:10px 6px 4px;border-radius:18px;background:rgba(6,16,18,.45)}
.sum h3{margin:0 0 6px;font-size:15px;font-weight:800;color:var(--ink)}
.sum h3 b{color:var(--slime);font-variant-numeric:tabular-nums}
.sum-row{display:flex;justify-content:space-between;gap:2px}
.sum-item{flex:1;min-width:0;border-radius:12px;padding:4px 0 2px;opacity:.55}
.sum-item.has{opacity:1}
.sum-item.me{background:rgba(139,224,90,.18);outline:2px solid rgba(139,224,90,.55)}
.sum-item img{height:40px;width:100%;object-fit:contain;display:block;animation:none}
.sum-item span{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.card.missed .amount{display:none}
.card.missed #rImg{display:none}
@media (prefers-reduced-motion:reduce){.wave,.card img{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="pond" id="pond">
    <svg class="wave" viewBox="0 0 400 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 7 Q25 0 50 7 T100 7 T150 7 T200 7 T250 7 T300 7 T350 7 T400 7 V14 H0Z" fill="#1f5552"/>
      <path d="M0 7 Q25 0 50 7 T100 7 T150 7 T200 7 T250 7 T300 7 T350 7 T400 7" fill="none" stroke="#5fb79a" stroke-width="1.5"/>
    </svg>
    <div class="status">
      <span class="pill" id="roundPill"></span>
      <span class="pill" id="todayPill" hidden></span>
    </div>
    <svg class="rod" id="rod" aria-hidden="true">
      <path id="rodPath" fill="none" stroke="#6b4a2b" stroke-width="5" stroke-linecap="round"/>
      <path id="rodGrip" fill="none" stroke="#2c1d10" stroke-width="7" stroke-linecap="round"/>
      <line id="line" stroke="rgba(234,247,228,.75)" stroke-width="1.2"/>
    </svg>
    <svg class="hook" id="hook" viewBox="0 0 18 26" aria-hidden="true">
      <circle cx="9" cy="3" r="2.5" fill="none" stroke="#d9e4e8" stroke-width="1.6"/>
      <path d="M9 5 V17 a5 5 0 0 1 -9 -2 l3 -2" fill="none" stroke="#d9e4e8" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="countdown" id="countdown"><small id="cdLabel"></small><strong id="cdTime">0:00</strong></div>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div class="dock">
    <button class="fishReturn" id="fishReturnBtn" type="button"></button>
    <div class="prizes" id="prizes"></div>
    <button class="cast" id="castBtn" disabled></button>
  </div>
</div>

<div class="result" id="result" role="dialog" aria-modal="true">
  <div class="card" id="card">
    <h2 id="rTitle"></h2>
    <img id="rImg" alt="">
    <div class="amount" id="rAmount"></div>
    <p id="rNote"></p>
    <div class="sum" id="sum"><h3 id="sumTitle"></h3><div class="sum-row" id="sumRow"></div></div>
    <button class="cast" id="rOk"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

  { id:"love",  currency:"TT",  amount:100 },
  { id:"sleep", currency:"TT",  amount:250 },
  { id:"cry",   currency:"TT",  amount:500 },
  { id:"arms",  currency:"TT",  amount:1500 },
  { id:"punch", currency:"TON", amount:0.5 }
];
// Nur für den Demo-Modus (ohne Server). Echte Chancen stehen in fishing.js.
const DEMO_WEIGHTS = { sleep:43, love:28, cry:17, arms:10, punch:2 };

const T = {
  de:{ back:"Zurück", cast:"Angel auswerfen", waitOthers:"Angel ist drin – alle ziehen gleich", reeling:"Alle ziehen …",
       next:"Nächste Babys in", castLeft:"Angel werfen noch", casters:"werfen mit", today:"Heute noch",
       limit:"Für heute aufgebraucht – morgen geht's weiter", tooLate:"Zu spät – nächste Runde",
       won:"Gefangen!", credited:"Wurde deiner Balance gutgeschrieben", demo:"Demo-Modus – nichts wird gutgeschrieben",
       ok:"Weiter", wait:"Warte auf die Babys", roundResult:"Ergebnis der Runde",
       missed:"Du hast diese Runde nicht geworfen", noOne:"Diese Runde hat niemand geworfen",
       sumTitle:n=>`Diese Runde: <b>${n}</b> ${n===1?"Person":"Leute"}`,
       err:{ round_closed:"Die Wurfzeit ist vorbei", already_cast:"Du hast schon geworfen",
             daily_limit:"Für heute aufgebraucht", auth:"Bitte die App über Telegram öffnen",
             server:"Verbindung fehlgeschlagen. Versuch es nochmal." },
       names:{ cry:"Heulsuse", love:"Verliebt", punch:"Boxer", arms:"Grummel", sleep:"Schlafmütze" } },
  fa:{ back:"بازگشت", cast:"قلاب بنداز", waitOthers:"قلابت توی آبه – همه با هم می‌کشن", reeling:"همه دارن می‌کشن …",
       next:"بچه‌های بعدی در", castLeft:"وقت قلاب انداختن", casters:"نفر قلاب انداختن", today:"دفعات باقی‌مانده امروز",
       limit:"سهم امروزت تموم شد – فردا دوباره", tooLate:"دیر شد – دور بعد",
       won:"گرفتی!", credited:"به موجودیت اضافه شد", demo:"حالت نمایشی – چیزی اضافه نمیشه",
       ok:"ادامه", wait:"منتظر بچه‌ها باش", roundResult:"نتیجهٔ این دور",
       missed:"این دور قلاب ننداختی", noOne:"این دور کسی قلاب ننداخت",
       sumTitle:n=>`این دور: <b>${n}</b> نفر`,
       err:{ round_closed:"وقت قلاب انداختن تموم شد", already_cast:"قبلاً قلاب انداختی",
             daily_limit:"سهم امروزت تموم شد", auth:"لطفاً برنامه رو از تلگرام باز کن",
             server:"اتصال برقرار نشد. دوباره امتحان کن" },
       names:{ cry:"گریه‌ای", love:"عاشق", punch:"مشت‌زن", arms:"اخمو", sleep:"خوابالو" } }
};

const API = "/api/fishing";
const tg = window.Telegram && window.Telegram.WebApp;
try { tg && tg.ready(); tg && tg.expand(); } catch(e){}
const initData = (tg && tg.initData) || "";
const qsLang = new URLSearchParams(location.search).get("lang");
const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
const LANG = qsLang === "de" ? "de" : "fa"; // Standard: Persisch
const L = T[LANG];
document.documentElement.lang = LANG;
document.documentElement.dir = LANG === "fa" ? "rtl" : "ltr";

const $ = id => document.getElementById(id);
const pond = $("pond"), castBtn = $("castBtn");
const HDR = () => ({ "X-Telegram-Init-Data": initData });

// "Zurück/بازگشت" oben im Dock: der Zurück-Button der Haupt-App sitzt oben
// links außerhalb dieser Seite (eigenes Overlay) und wird dort durch die
// Status-Pillen dieser Seite verdeckt/überlagert - dieser Button hier ist
// immer sichtbar und sauber erreichbar, direkt über dem Angel-Button.
const fishReturnBtn = $("fishReturnBtn");
fishReturnBtn.textContent = L.back;
fishReturnBtn.onclick = () => {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "zombie-angeln-close" }, "*");
  } else if (window.history.length > 1) {
    window.history.back();
  } else {
    window.close();
  }
};

let demo = !initData;
let everyMs = 120000, castMs = 15000, showMs = 45000, anchor = 0, offset = 0;
let castRound = -1, catchesLeft = null, casters = 0;
let busy = false;          // Wurf-Request läuft
let reeling = false;       // gemeinsames Ziehen + Ergebnis läuft
let resolvedRound = -1;    // für welche Runde das Ergebnis schon geholt wurde
let seenWindowOf = -1;     // in welcher Runde wir während der Wurfzeit da waren
let demoCasters = 0;

const now = () => Date.now() + offset;
const phase = () => ((now() - anchor) % everyMs + everyMs) % everyMs;
const roundIdx = () => Math.floor((now() - anchor) / everyMs);
const inWindow = () => phase() < castMs;
const babiesOut = () => phase() < showMs;
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const fmtAmount = p => p.currency === "TON" ? "+" + p.amount + " TON" : "+" + p.amount.toLocaleString("en-US") + " TT";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const haptic = (k, v) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[k](v); } catch(e){} };

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

function renderPrizes(){
  $("prizes").innerHTML = PRIZES.map(p =>
    `<div class="prize ${p.currency==="TON"?"ton":""}"><img src="${IMG[p.id]}" alt="${L.names[p.id]}"><span>${p.currency==="TON"?p.amount+" TON":p.amount.toLocaleString("en-US")+" TT"}</span></div>`
  ).join("");
}

function startDemo(){
  demo = true; offset = 0;
  anchor = Date.now() - everyMs + 2500; // erste Runde startet in 2,5 s
  $("banner").textContent = L.demo; $("banner").hidden = false;
}

async function loadState(){
  if (demo) return;
  try {
    const t0 = Date.now();
    const r = await fetch(API + "/state", { headers: HDR() });
    if (!r.ok) throw new Error("state " + r.status);
    const j = await r.json();
    offset = j.serverNow - Math.round((t0 + Date.now())/2);
    everyMs = j.everyMs; castMs = j.castMs; showMs = j.showMs; anchor = 0;
    casters = j.casters || 0;
    if (j.castThisRound) castRound = j.roundId;
    catchesLeft = j.catchesLeftToday;
    if (Array.isArray(j.prizes)) {
      PRIZES = j.prizes.slice().sort((a,b)=> (a.currency==="TON")-(b.currency==="TON") || a.amount-b.amount);
      renderPrizes();
    }
  } catch(e) { console.warn(e); if (!initData) startDemo(); else if (!loadState.ok) startDemo(); return; }
  loadState.ok = true;
}

/* ---------- scene ---------- */
let W=0, H=0, surfaceY=0;
const tip = { x:0, y:0 };
const hook = { x:0, y:0, ty:0, rest:0, down:0 };
function layout(){
  const r = pond.getBoundingClientRect(); W = r.width; H = r.height;
  surfaceY = H * 0.20;
  tip.x = W * (LANG==="fa" ? 0.42 : 0.58); tip.y = H * 0.085;
  hook.x = tip.x; hook.rest = surfaceY - 22; hook.down = surfaceY + (H - surfaceY) * 0.42;
  if (!reeling) hook.y = hook.ty = (castRound === roundIdx() && inWindow()) ? hook.down : hook.rest;
  const rod = $("rod"); rod.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const baseX = LANG==="fa" ? -10 : W + 10, baseY = H * 0.17;
  const ctrlX = (baseX + tip.x)/2, ctrlY = tip.y - 8;
  $("rodPath").setAttribute("d", `M${baseX} ${baseY} Q${ctrlX} ${ctrlY} ${tip.x} ${tip.y}`);
  const gx = LANG==="fa" ? baseX + 40 : baseX - 40;
  $("rodGrip").setAttribute("d", `M${baseX} ${baseY} L${gx} ${baseY - 6}`);
}
window.addEventListener("resize", layout);

const babies = [];
const babyH = () => Math.max(64, Math.min(96, H * 0.16));
function spawn(type, opts = {}){
  type = type || randomType();
  const h = type === "sleep" ? babyH()*0.62 : babyH();
  const w = h * RATIO[type];
  const fromLeft = opts.fromLeft ?? Math.random() < 0.5;
  const minY = surfaceY + 16, maxY = H - h - 18;
  const b = {
    type, w, h,
    x: fromLeft ? -w - 10 : W + 10,
    y: opts.y ?? (minY + Math.random() * Math.max(10, maxY - minY)),
    vx: (fromLeft ? 1 : -1) * (24 + Math.random()*26) * (type==="sleep" ? 0.6 : 1),
    ph: Math.random() * 6.28, state: "swim", alpha: 1, rot: 0
  };
  const el = document.createElement("div"); el.className = "baby";
  el.style.width = w + "px"; el.style.height = h + "px";
  const img = document.createElement("img"); img.src = IMG[type]; img.alt = ""; img.draggable = false;
  el.appendChild(img); pond.appendChild(el); b.el = el;
  babies.push(b); return b;
}
function randomType(){ const ids = Object.keys(IMG); return ids[Math.floor(Math.random()*ids.length)]; }
function removeBaby(b){ b.el.remove(); const i = babies.indexOf(b); if (i>=0) babies.splice(i,1); }

function bubbles(x, y, n=5){
  for (let i=0;i<n;i++){
    const d = document.createElement("div"); d.className="bubble";
    d.style.left = (x + (Math.random()*30-15)) + "px"; d.style.top = (y + Math.random()*10) + "px";
    d.style.animationDuration = (0.9 + Math.random()*0.9) + "s";
    pond.appendChild(d); setTimeout(()=>d.remove(), 2000);
  }
}
function splash(x){ const s=document.createElement("div"); s.className="splash"; s.style.left=x+"px"; s.style.top=surfaceY+"px"; pond.appendChild(s); setTimeout(()=>s.remove(),800); }

/* ---------- loop ---------- */
let last = performance.now(), spawnT = 0, wasOut = false, wasWindow = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(t){
  const dt = Math.min(0.05, (t - last)/1000); last = t;
  const out = babiesOut(), win = inWindow(), rid = roundIdx();

  if (out && !wasOut) { for (let i=0;i<4;i++) setTimeout(()=>babiesOut() && spawn(null), i*350); demoCasters = 0; }
  if (!out && wasOut) babies.forEach(b => { if (b.state==="swim") { b.state="leave"; b.vx = (b.x + b.w/2 < W/2 ? -1 : 1) * 140; } });
  if (win) seenWindowOf = rid;
  // Wurfzeit vorbei → alle ziehen gleichzeitig
  if (!win && wasWindow && seenWindowOf === rid && resolvedRound !== rid) { resolvedRound = rid; finishRound(rid); }
  wasOut = out; wasWindow = win;

  if (out) {
    spawnT -= dt;
    const swimming = babies.filter(b => b.state==="swim").length;
    if (spawnT <= 0 && swimming < 6) { spawn(null); spawnT = 1.2 + Math.random()*1.5; }
  }
  if (demo && win && Math.random() < dt * 1.6) demoCasters++;

  hook.y += (hook.ty - hook.y) * Math.min(1, dt * 6);

  for (const b of babies.slice()) {
    b.ph += dt * (b.type==="sleep" ? 1.2 : 2.4);
    const bob = reduce ? 0 : Math.sin(b.ph) * (b.type==="sleep" ? 3 : 6);
    if (b.state === "swim" || b.state === "leave") {
      b.x += b.vx * dt;
      b.rot = reduce ? 0 : Math.sin(b.ph*0.8) * 5;
      if (b.state === "leave") b.alpha = Math.max(0, b.alpha - dt*0.8);
      if (b.x > W + b.w + 20 || b.x < -b.w*2 - 20 || b.alpha <= 0) { removeBaby(b); continue; }
    } else if (b.state === "lured") {
      const tx = hook.x - b.w/2, ty = hook.y + 18;
      const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
      const sp = 220 * dt;
      if (d <= sp + 2) { b.x = tx; b.y = ty; b.state = "hooked"; b.el.classList.add("hooked"); b.onHooked && b.onHooked(); }
      else { b.x += dx/d*sp; b.y += dy/d*sp; }
      b.rot = Math.sin(b.ph*2) * 6;
    } else if (b.state === "hooked") {
      b.x = hook.x - b.w/2; b.y = hook.y + 18;
      b.rot = reduce ? 0 : Math.sin(b.ph*4) * 12;
    }
    const y = b.state==="swim"||b.state==="leave" ? b.y + bob : b.y;
    b.el.style.transform = `translate(${b.x}px,${y}px) rotate(${b.rot}deg)`;
    b.el.style.opacity = b.alpha;
  }

  $("hook").style.transform = `translate(${hook.x}px,${hook.y}px)`;
  const line = $("line");
  line.setAttribute("x1", tip.x); line.setAttribute("y1", tip.y);
  line.setAttribute("x2", hook.x); line.setAttribute("y2", hook.y);

  updateUI(win, out);
  requestAnimationFrame(tick);
}

let uiKey = "";
function updateUI(win, out){
  const ph = phase();
  const cd = $("countdown");
  cd.classList.toggle("hide", out);
  $("cdLabel").textContent = L.next;
  $("cdTime").textContent = fmt(everyMs - ph);

  const n = demo ? demoCasters + (castRound === roundIdx() ? 1 : 0) : casters;
  $("roundPill").innerHTML = win ? `${L.castLeft} <b>${fmt(castMs - ph)}</b>` : `${L.next} <b>${fmt(everyMs - ph)}</b>`;
  const tp = $("todayPill");
  if (win) { tp.hidden = false; tp.innerHTML = `<b>${n}</b> ${L.casters}`; }
  else if (catchesLeft != null) { tp.hidden = false; tp.innerHTML = `${L.today} <b>${catchesLeft}</b>`; }
  else tp.hidden = true;

  let text, dis;
  const cast = castRound === roundIdx();
  if (reeling) { text = L.reeling; dis = true; }
  else if (catchesLeft === 0) { text = L.limit; dis = true; }
  else if (win && cast) { text = L.waitOthers; dis = true; }
  else if (win) { text = `${L.cast} (${Math.ceil((castMs - ph)/1000)})`; dis = busy; }
  else if (out) { text = L.tooLate; dis = true; }
  else { text = L.wait; dis = true; }
  const key = text + dis;
  if (key !== uiKey) { uiKey = key; castBtn.textContent = text; castBtn.disabled = dis; }
}

/* ---------- werfen ---------- */
async function cast(){
  const rid = roundIdx();
  if (busy || reeling || !inWindow() || castRound === rid || catchesLeft === 0) return;
  busy = true;
  haptic("impactOccurred", "medium");
  hook.ty = hook.down; splash(hook.x); setTimeout(()=>bubbles(hook.x, hook.down), 400);
  try {
    if (demo) { await sleep(250); }
    else {
      const r = await fetch(API + "/cast", { method:"POST", headers:{ "Content-Type":"application/json", ...HDR() }, body:"{}" });
      const j = await r.json().catch(()=>({ error:"server" }));
      if (!r.ok) throw j;
      casters = j.casters; catchesLeft = j.catchesLeftToday;
    }
    castRound = rid;
  } catch(e) {
    const code = (e && e.error) || "server";
    if (code === "already_cast") castRound = rid;
    else { hook.ty = hook.rest; if (code === "daily_limit") catchesLeft = 0; }
    toast(L.err[code] || L.err.server);
  } finally { busy = false; }
}

/* ---------- gemeinsames Ziehen ---------- */
function demoPick(){
  const ids = Object.keys(DEMO_WEIGHTS); const total = ids.reduce((s,k)=>s+DEMO_WEIGHTS[k],0);
  let r = Math.random()*total; for (const k of ids){ if (r < DEMO_WEIGHTS[k]) return PRIZES.find(p=>p.id===k); r -= DEMO_WEIGHTS[k]; }
  return PRIZES[0];
}

async function fetchResult(rid){
  if (demo) {
    await sleep(400);
    const counts = {}; PRIZES.forEach(p => counts[p.id] = 0);
    for (let i=0;i<demoCasters;i++) counts[demoPick().id]++;
    let prize = null;
    if (castRound === rid) { prize = demoPick(); counts[prize.id]++; }
    return { prize, counts, participants: demoCasters + (prize ? 1 : 0) };
  }
  for (let i=0;i<12;i++){
    await sleep(i ? 900 : 500);
    try {
      const r = await fetch(`${API}/result?roundId=${rid}`, { headers: HDR() });
      if (r.status === 425) continue;
      if (!r.ok) throw new Error("result " + r.status);
      return await r.json();
    } catch(e) { console.warn(e); }
  }
  throw new Error("no result");
}

async function finishRound(rid){
  const iCast = castRound === rid;
  reeling = true;
  let res;
  try { res = await fetchResult(rid); }
  catch(e) { reeling = false; hook.ty = hook.rest; toast(L.err.server); return; }

  const prize = res.prize;
  let b = null;
  if (iCast && prize) {
    b = babies.filter(x => x.type === prize.id && x.state === "swim")
              .sort((a,c)=> Math.abs(a.x - hook.x) - Math.abs(c.x - hook.x))[0];
    if (!b) b = spawn(prize.id, { y: hook.down + 30 });
    await new Promise(resolve => { b.onHooked = resolve; b.state = "lured"; });
    haptic("notificationOccurred", "success");
    bubbles(hook.x, hook.y + 20, 8);
    await sleep(250);
    hook.ty = tip.y + 30;
    await sleep(900);
  } else {
    hook.ty = hook.rest;
    await sleep(1800); // ungefähr gleichzeitig mit den anderen
  }
  showResult(prize, res, () => { if (b) removeBaby(b); hook.y = hook.ty = hook.rest; reeling = false; });
  if (!demo) loadState();
}

function showResult(p, res, onClose){
  const card = $("card");
  card.classList.toggle("ton", !!p && p.currency === "TON");
  card.classList.toggle("missed", !p);
  if (p) {
    $("rTitle").textContent = L.won + " " + L.names[p.id];
    $("rImg").src = IMG[p.id];
    $("rAmount").textContent = fmtAmount(p);
    $("rNote").textContent = demo ? L.demo : L.credited;
  } else {
    $("rTitle").textContent = L.roundResult;
    $("rNote").textContent = res.participants ? L.missed : L.noOne;
  }
  const total = res.participants || 0;
  $("sum").hidden = !total;
  $("sumTitle").innerHTML = L.sumTitle(total);
  $("sumRow").innerHTML = PRIZES.map(q => {
    const c = (res.counts && res.counts[q.id]) || 0;
    return `<div class="sum-item ${c?"has":""} ${p && p.id===q.id?"me":""}"><img src="${IMG[q.id]}" alt="${L.names[q.id]}"><span>×${c}</span></div>`;
  }).join("");
  $("rOk").textContent = L.ok;
  const box = $("result"); box.classList.add("show");
  setTimeout(()=>$("rOk").focus(), 50);
  $("rOk").onclick = () => { box.classList.remove("show"); onClose(); };
}

castBtn.addEventListener("click", cast);

renderPrizes();
layout();
(demo ? Promise.resolve(startDemo()) : loadState()).then(() => { layout(); requestAnimationFrame(t => { last = t; tick(t); }); });
// Während der Wurfzeit öfter aktualisieren (Anzahl Werfer), sonst jede Minute
let lastPoll = 0;
setInterval(() => {
  if (demo || reeling) return;
  const gap = inWindow() ? 2500 : 30000;
  if (Date.now() - lastPoll >= gap) { lastPoll = Date.now(); loadState(); }
}, 1000);
})();
</script>

</body>
