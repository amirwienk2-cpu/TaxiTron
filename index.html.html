<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Zombie Taxi: Dead Ride</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root{--yellow:#ff9d2e;--red:#a92cff;--ink:#08060d;--panel:#15101d;--green:#84d52e}
      *{box-sizing:border-box} html,body,#game-container{width:100%;height:100%;margin:0;overflow:hidden;background:#050605;color:#fff}
      body{touch-action:none;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 10%,#39210d,#050605 62%)}
      #game-container{position:relative;max-width:560px;margin:auto;box-shadow:0 0 50px #000}
      canvas{display:block;width:100%;height:100%;background:#090b0e;touch-action:none}
      #hud{position:absolute;left:4%;right:4%;top:max(5%,env(safe-area-inset-top));height:64px;display:flex;justify-content:space-between;pointer-events:none;filter:drop-shadow(0 2px 2px #000)}
      .stat{display:flex;flex-direction:column}.label{font-size:9px;letter-spacing:1.5px;color:#ddd;font-weight:900}.value{font:900 21px Orbitron;color:#fff}.coin{color:var(--yellow)}
      #hearts{font-size:20px;text-align:right;color:#f43;letter-spacing:2px}.distance{font:800 12px Orbitron;color:#aaa;text-align:right}
      #mute{position:absolute;right:4%;top:calc(max(5%,env(safe-area-inset-top)) + 66px);width:46px;height:46px;border:1px solid #ffffff30;border-radius:50%;background:#0a0c0bdd;color:white;font-size:19px;z-index:8}
      #combo{position:absolute;top:19%;width:100%;text-align:center;font:900 26px Orbitron;color:#ffdd24;text-shadow:0 3px #9d130d;opacity:0;transform:scale(.7);transition:.15s;pointer-events:none}.show{opacity:1!important;transform:scale(1)!important}
      #panel{position:absolute;inset:0 0 86px 0;display:flex;align-items:center;justify-content:center;padding:8% 6%;background:linear-gradient(#0008,#090b09e8);z-index:5}
      #panel.hidden{display:none}.card{width:100%;max-height:90%;overflow:auto;background:linear-gradient(145deg,#20251f,#0b0d0c);border:2px solid #ffffff20;border-top-color:#ffcc28;border-radius:22px;padding:22px;box-shadow:0 18px 50px #000,0 0 28px #ffad0015}
      .eyebrow{font:900 11px Orbitron;color:#e63b26;letter-spacing:3px}.title{margin:5px 0 8px;font:900 clamp(30px,10vw,48px)/.9 Orbitron;color:#ffad3d;text-shadow:3px 4px #53126f}.subtitle{color:#bfc3bd;font-size:13px;line-height:1.45;margin:8px 0 18px}
      .btn{width:100%;min-height:56px;border:0;border-radius:14px;background:linear-gradient(#ffe348,#f1a700);color:#171300;font:900 17px Orbitron;box-shadow:0 5px 0 #8d4d00,0 9px 18px #0008;margin:8px 0}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8d4d00}.btn.red{background:linear-gradient(#c43cff,#68119e);color:#fff;box-shadow:0 5px 0 #32064d}.mini-row{display:flex;gap:10px}.mini{flex:1;background:#090b0a;border:1px solid #ffffff1c;border-radius:13px;padding:12px}.mini b{font:800 18px Orbitron;color:#ffd52a}.mini small{display:block;color:#92978f;margin-top:4px}
      .list{display:grid;gap:10px;margin-top:15px}.item{display:flex;align-items:center;gap:12px;background:#090b0a;border:1px solid #ffffff18;border-radius:14px;padding:12px}.item-icon{font-size:27px;width:40px;text-align:center}.item-text{flex:1}.item-text b{display:block;font:800 13px Orbitron}.item-text small{color:#999}.pill{border:0;border-radius:10px;padding:10px;background:#ff9d2e;color:#190d00;font-weight:900;min-width:72px}.pill:disabled{filter:grayscale(1);opacity:.55}
      #nav{position:absolute;z-index:10;left:0;right:0;bottom:0;height:calc(82px + env(safe-area-inset-bottom));padding:7px 3% max(7px,env(safe-area-inset-bottom));display:flex;align-items:flex-start;justify-content:space-around;background:linear-gradient(#171a18,#080908);border-top:1px solid #ffffff1f}
      .nav-btn{width:19%;height:66px;border:0;background:transparent;color:#777;font:800 9px Inter;display:flex;flex-direction:column;align-items:center;gap:4px}.nav-btn span{font-size:23px}.nav-btn.active{color:#ffd326}.nav-btn[data-page="play"]{transform:translateY(-19px)}.nav-btn[data-page="play"] span{display:grid;place-items:center;width:57px;height:57px;border-radius:50%;background:#ffc61a;color:#171300;border:5px solid #2b2e2a;box-shadow:0 4px 13px #000;font-size:25px}.nav-btn[data-page="play"] em{font-style:normal;margin-top:-3px}
      #steerHint{position:absolute;left:0;right:0;bottom:100px;text-align:center;font:800 11px Orbitron;color:#fff9;pointer-events:none;opacity:0;transition:.3s}.playing #steerHint{opacity:1}
      @media (min-width:600px){#game-container{border-left:1px solid #333;border-right:1px solid #333}}
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game"></canvas>
      <div id="hud"><div class="stat"><span class="label">SCORE</span><span class="value" id="score">00000</span><span class="label coin" id="coins">◉ 0</span></div><div><div id="hearts">⚠ 1 HIT</div><div class="distance" id="distance">0 M</div></div></div>
      <button id="mute" aria-label="Ton aus">🔊</button><div id="combo">COMBO ×2</div><div id="steerHint">↔ ZIEHEN ZUM LENKEN ↔</div>
      <section id="panel"><div class="card" id="card"></div></section>
      <nav id="nav" aria-label="Hauptnavigation">
        <button class="nav-btn active" data-page="home"><span>⌂</span>HOME</button><button class="nav-btn" data-page="shop"><span>🛒</span>SHOP</button><button class="nav-btn" data-page="play"><span>▶</span><em>PLAY</em></button><button class="nav-btn" data-page="tasks"><span>✓</span>TASKS</button><button class="nav-btn" data-page="wallet"><span>◈</span>EARN</button>
      </nav>
    </div>
    <script type="module" src="./main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ImageGenerator.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
  </body>
</html>
