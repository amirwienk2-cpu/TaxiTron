<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaxiTon · نبرد با باس</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12131c; --panel:#1c1e2b; --panel2:#232637; --line:#2e3248;
  --navy:#141a45; --gold:#ffc61a; --gold2:#f0a500; --goldtxt:#2a1e00;
  --text:#eef0fa; --muted:#9aa0bd; --name:#9db0ff; --green:#2bd45a; --red:#ff4d5e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#12131c; } }
:root[data-theme="dark"]{ --bg:#12131c; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:12px 12px 120px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* tabs */
.tabs{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.tab{flex:1;height:46px;border-radius:14px;background:linear-gradient(#2a2d3d,#1d2030);font-weight:800;font-size:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 3px 0 #0c0d14}
.tab.on{background:linear-gradient(#ffd84a,var(--gold2));color:var(--goldtxt);box-shadow:0 4px 0 #b77a00,0 0 18px rgba(255,198,26,.35)}
.tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.cd{height:46px;padding:0 12px;border-radius:14px;background:var(--panel2);display:flex;align-items:center;gap:4px;font-weight:800;color:var(--gold);white-space:nowrap}

/* race card */
.race{background:linear-gradient(180deg,#1b2150,#171a2a 60%);border:1.5px solid #3a3f6b;border-radius:20px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.race.win{border-color:var(--gold);box-shadow:0 0 24px rgba(255,198,26,.25)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rtitle{font-size:20px;font-weight:900;color:var(--gold);letter-spacing:.2px}
.rsub{font-size:13px;color:var(--muted);margin-top:2px}
.pot{text-align:right}
.pot b{display:block;font-size:22px;font-weight:900}
.pot span{font-size:12px;color:var(--muted)}
.timer{height:5px;border-radius:5px;background:#2a2e47;margin:12px 0 10px;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a00);transition:width 1s linear}

.lane{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.05)}
.lane:first-of-type{border-top:0}
.lane.winner .track{background:linear-gradient(90deg,rgba(255,198,26,.08),rgba(255,198,26,.25))}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;border:2px solid #4b5180;flex:none}
.lmid{min-width:0}
.lname{font-size:13px;font-weight:800;color:var(--name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:26px;margin-top:3px;border-radius:8px;background:repeating-linear-gradient(90deg,#262a40 0 14px,#22263a 14px 28px)}
.track::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;border-radius:0 8px 8px 0;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/8px 8px}
.car{position:absolute;top:0;font-size:22px;line-height:26px;transform:scaleX(-1)}
.fx{position:absolute;top:-2px;font-size:13px}
.lright{text-align:right;min-width:74px}
.odds{font-size:12px;color:var(--muted);white-space:nowrap}
.odds b{color:var(--text)}
.betbtn{margin-top:3px;padding:5px 12px;border-radius:10px;background:linear-gradient(#ffd84a,var(--gold2));color:var(--goldtxt);font-weight:900;font-size:13px;box-shadow:0 2px 0 #b77a00}
.mine{display:inline-block;margin-top:3px;font-size:12px;font-weight:800;color:var(--gold)}
.result{margin-top:10px;padding:12px;border-radius:14px;background:rgba(255,198,26,.1);border:1px solid rgba(255,198,26,.35);text-align:center}
.result h3{margin:0 0 4px;font-size:18px}
.result p{margin:0;color:var(--muted);font-size:14px}
.result .won{color:var(--gold);font-weight:900;font-size:17px;margin-top:6px}
.result .lost{color:var(--muted);font-weight:700;margin-top:6px}
.next{margin-top:10px;width:100%;height:44px;border-radius:12px;background:linear-gradient(#ffd84a,var(--gold2));color:var(--goldtxt);font-weight:900;box-shadow:0 3px 0 #b77a00}

/* list */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px;color:var(--muted)}
.phead b{color:var(--text);font-size:20px}
.gdot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #262a3c}
.row:first-of-type{border-top:0}
.row .ava{width:46px;height:46px;font-size:16px;position:relative}
.row .ava::after{content:"";position:absolute;right:-1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--panel)}
.rinfo{flex:1;min-width:0}
.rname{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;color:var(--name)}
.rname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{flex:none;font-size:12px;font-weight:800;color:var(--gold);background:#3b3220;padding:2px 8px;border-radius:9px}
.rstat{font-size:14px;color:var(--muted);margin-top:2px}
.tag{flex:none;text-align:right;font-size:12px;font-weight:800}
.tag .racing{display:inline-block;padding:4px 9px;border-radius:9px;background:rgba(255,198,26,.14);color:var(--gold);border:1px solid rgba(255,198,26,.4)}
.tag .bets{display:block;color:var(--muted);margin-top:4px;font-weight:700}
.tag .champ{display:inline-block;padding:4px 9px;border-radius:9px;background:linear-gradient(#ffd84a,var(--gold2));color:var(--goldtxt)}

/* chat */
.msgs{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto}
.msg{display:flex;gap:8px;align-items:flex-end}
.bubble{background:var(--panel2);border-radius:16px;padding:9px 12px;max-width:80%}
.bubble .who{font-size:13px;font-weight:800;color:var(--name);margin-bottom:2px}
.bubble.bot{background:linear-gradient(180deg,#2a2410,#1f1c12);border:1px solid rgba(255,198,26,.35)}
.bubble.bot .who{color:var(--gold)}
.bubble .t{font-size:15px;line-height:1.35}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.composer div{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;padding:0 16px}
.composer span{width:44px;height:44px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--goldtxt);font-weight:900}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
.sheet{width:100%;max-width:480px;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet h4{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:44px;border-radius:12px;background:var(--panel2);font-weight:800;border:1.5px solid transparent}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip:disabled{opacity:.35}
.sheet .row2{display:flex;gap:8px;margin-top:14px}
.ghost{flex:1;height:46px;border-radius:12px;background:var(--panel2);font-weight:800}
.place{flex:2;height:46px;border-radius:12px;background:linear-gradient(#ffd84a,var(--gold2));color:var(--goldtxt);font-weight:900;box-shadow:0 3px 0 #b77a00}
.place:disabled{opacity:.4}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
</style>
<style>
.race.inchat{margin:12px}
.racebtn{padding:8px 12px;border-radius:12px;background:linear-gradient(#ffd84a,var(--gold2));color:var(--goldtxt);font-weight:900;font-size:14px;box-shadow:0 3px 0 #b77a00;font-variant-numeric:tabular-nums}
.racebtn.live{background:linear-gradient(#ff6b6b,#d63345);color:#fff;box-shadow:0 3px 0 #8f1f2b;animation:pulse 1s infinite}
.racebtn.soon{background:linear-gradient(#b26bff,#7a3ad6);color:#fff;box-shadow:0 3px 0 #4b1f8f}
@keyframes pulse{50%{transform:scale(1.06)}}
.paused{margin:0 12px;padding:10px;border-radius:12px;background:var(--panel2);color:var(--muted);text-align:center;font-size:14px}
.back{display:block;width:calc(100% - 24px);margin:10px 12px 14px;height:44px;border-radius:12px;background:var(--panel2);font-weight:800}
.wait{padding:18px 6px 6px;text-align:center;color:var(--muted);font-size:14px}
.wait b{display:block;font-size:40px;font-weight:900;color:var(--text);margin-bottom:4px;font-variant-numeric:tabular-nums}
.skip{margin-top:10px;background:none;color:var(--muted);font-size:12px;text-decoration:underline}

/* arena */
.arena{position:relative;margin:-14px -14px 0;padding:14px 14px 10px;border-radius:20px 20px 0 0;background:radial-gradient(120% 80% at 50% 30%,#3a1430 0%,#1a1030 45%,#121427 100%);overflow:hidden}
.arena.rage{background:radial-gradient(120% 80% at 50% 30%,#5a0f1c 0%,#2a0d1c 50%,#140d18 100%)}
.arena.shake{animation:ashake .18s}
@keyframes ashake{25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bossname{font-weight:900;font-size:15px;letter-spacing:.3px}
.bossname small{display:block;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:1px}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.ring.low b{color:var(--red)}
.hpwrap{margin-top:10px}
.hpbar{position:relative;height:18px;border-radius:9px;background:#1b0f18;border:1.5px solid #4a2236;overflow:hidden}
.hpbar .trail{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.55;transition:width .6s ease-out .15s}
.hpbar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff2d55,#ff7a3d 70%,#ffc61a);transition:width .08s}
.arena.rage .hpbar .fill{background:linear-gradient(90deg,#b0002a,#ff2d55)}
.hpbar .seg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.45) calc(10% - 1px) 10%)}
.hpmeta{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.stage{position:relative;height:290px;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.bosswrap{height:100%;display:grid;place-items:center;animation:idle 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes idle{50%{transform:scaleY(1.025) translateY(-2px)}}
.arena.rage .bosswrap{animation-duration:.9s}
.bosssvg{height:270px;width:auto;max-width:100%;transition:transform .07s,filter .07s;filter:drop-shadow(0 14px 16px rgba(0,0,0,.65));-webkit-user-drag:none;pointer-events:none}
.bosssvg.hurt{transform:scale(.95) rotate(-2.5deg);filter:brightness(1.9) drop-shadow(0 0 10px rgba(255,255,255,.6))}
.arena.rage .bosssvg{filter:drop-shadow(0 0 20px rgba(255,30,60,.85)) saturate(1.35)}
.arena.rage .bosssvg.hurt{filter:brightness(1.9) drop-shadow(0 0 20px rgba(255,30,60,.85))}
.floor{position:absolute;bottom:8px;left:50%;width:180px;height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%)}
.slash{position:absolute;width:70px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 10px #fff,0 0 18px rgba(255,90,110,.8);pointer-events:none;animation:slash .22s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scaleX(.2)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1.2)}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd84a;pointer-events:none;animation:spark .35s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y));opacity:0}}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(255,0,40,0);transition:box-shadow .3s}
.arena.rage .vignette{box-shadow:inset 0 0 70px rgba(255,0,40,.45)}
.dead .bosswrap{animation:none}.dead .bosssvg{filter:grayscale(1) brightness(.55);transform:rotate(-78deg) translate(-40px,40px);transition:transform .9s cubic-bezier(.5,0,.8,.4),filter .9s}
.num{position:absolute;font-weight:900;pointer-events:none;animation:pop .8s ease-out forwards;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);white-space:nowrap}
.num.me{color:#fff;font-size:20px}
.num.other{color:#c9a7ff;font-size:13px;opacity:.85}
.num.crit{color:var(--gold);font-size:28px}
.num.blk{color:#9aa0bd;font-size:15px}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6)}20%{transform:translate(-50%,-14px) scale(1.15)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.combo{position:absolute;right:6px;top:8px;text-align:right;font-weight:900;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.combo b{display:block;font-size:26px;color:var(--gold);line-height:1;text-shadow:0 0 12px rgba(255,198,26,.5)}
.combo span{font-size:11px;color:var(--muted);letter-spacing:1px}
.combo.hot b{color:#ff7a3d}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.banner div{font-size:30px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 18px rgba(255,45,85,.9),0 3px 0 #000;animation:ban 1.4s forwards}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.count{font-size:72px!important}
.ticker{height:18px;margin-top:2px;font-size:12px;color:var(--muted);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tapbtn{position:relative;display:block;width:100%;height:64px;margin-top:10px;border-radius:18px;background:linear-gradient(#ff5a6e,#c8213a);color:#fff;font-weight:900;font-size:20px;letter-spacing:1px;box-shadow:0 5px 0 #7a1222,0 10px 24px rgba(255,45,85,.3);overflow:hidden;touch-action:manipulation}
.tapbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a1222}
.tapbtn small{display:block;font-size:11px;font-weight:700;opacity:.8;letter-spacing:.5px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .45s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.mystats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mystats div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px;text-align:center}
.mystats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.mystats span{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.8px}
.lb{margin-top:10px;background:rgba(0,0,0,.25);border-radius:12px;padding:10px}
.lb h5{margin:0 0 6px;font-size:11px;color:var(--muted);letter-spacing:1px}
.lbr{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.lbr .bar{grid-column:2/4;height:4px;border-radius:2px;background:#2a2e47;overflow:hidden;margin-top:-2px}
.lbr .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff7a3d)}
.lbr.me{color:var(--gold);font-weight:800}
.lbr b{font-variant-numeric:tabular-nums}
.res{text-align:center}
.res h3{margin:4px 0 2px;font-size:22px}
.res p{margin:0;color:var(--muted);font-size:13px}
.rw{margin-top:12px;text-align:left}
.rw div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14px}
.rw div b{color:var(--gold)}
.mine{margin-top:12px;padding:12px;border-radius:14px;background:linear-gradient(180deg,rgba(255,198,26,.18),rgba(255,198,26,.06));border:1px solid rgba(255,198,26,.4);font-weight:900;font-size:18px;color:var(--gold)}
.mine.none{background:var(--panel2);border-color:var(--line);color:var(--muted);font-size:14px}
.shieldfx{position:absolute;left:50%;top:50%;width:230px;height:290px;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:3px solid rgba(110,200,255,.9);background:radial-gradient(circle,rgba(110,200,255,.08) 40%,rgba(110,200,255,.35) 100%);box-shadow:0 0 30px rgba(110,200,255,.6),inset 0 0 30px rgba(110,200,255,.4);opacity:0;transition:opacity .15s,transform .2s;pointer-events:none}
.arena.shielded .shieldfx{opacity:1;transform:translate(-50%,-50%) scale(1)}
.arena.shielded{background:radial-gradient(120% 80% at 50% 30%,#123a5a 0%,#101c36 50%,#121427 100%)}
.tapbtn.shieldbtn{background:linear-gradient(#5ab8ff,#2a6fd6);box-shadow:0 5px 0 #173f80,0 10px 24px rgba(90,184,255,.35)}
.num.pen{color:#ff4d5e;font-size:18px}
.lbr .auto{font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.arena.shake,.num,.banner div{animation-duration:.01s}}
[dir=rtl] body{font-family:"Vazirmatn",Tahoma,-apple-system,system-ui,sans-serif}
[dir=rtl] .hpbar .fill,[dir=rtl] .hpbar .trail{inset:0 0 0 auto}
[dir=rtl] .combo{right:auto;left:6px;text-align:left}
[dir=rtl] .tag,[dir=rtl] .pot,[dir=rtl] .prize{text-align:left}
.bossname small,.mystats span,.lb h5{letter-spacing:0}
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <button class="tab on" data-tab="chat">چت</button>
    <button class="tab" data-tab="online"><span class="dot"></span>آنلاین</button>
  </div>
  <section id="online" class="panel hidden">
    <div class="phead"><span class="gdot"></span><b id="cnt">۵۰</b> آنلاین</div>
    <div id="list"></div>
  </section>
  <section id="chat" class="panel">
    <div class="phead chead"><span style="color:var(--gold);font-weight:900;flex:1">TaxiTon Chat · FA</span>
      <button class="racebtn" id="bossBtn">👹 0:00</button></div>
    <div id="chatBody">
      <div class="msgs" id="msgs"></div>
      <div class="composer"><div>پیام بنویسید…</div><span>➤</span></div>
    </div>
    <div id="bossView" class="hidden">
      <section class="race inchat" id="card" aria-live="polite"><div id="body"></div></section>
      <div class="paused" id="paused">💬 چت در طول نبرد متوقف است</div>
      <button class="back" id="backBtn">بازگشت به چت</button>
    </div>
  </section>
</div>

<script>
const COLORS=["#7b5cff","#ff6b6b","#1fb5a4","#f59f00","#4c8dff","#e64980","#20c997","#845ef7","#fa5252","#15aabf","#94d82d"];
const USERS=[
  {id:"sup",name:"TaxiTonSupport",lv:1,st:"🚕 در حال رانندگی"},
  {id:"ali",name:"Alireza_kh9090",lv:1,st:"آنلاین"},
  {id:"me",name:"TaxiTonAgent",lv:4,st:"شما آنلاین هستید",me:true},
  {id:"yon",name:"Yonesbalooch",lv:1,st:"🚕 در حال رانندگی"},
  {id:"fae",name:"Faez",lv:1,st:"آنلاین"},
  {id:"imo",name:"imo051",lv:1,st:"آنلاین"},

const INTERVAL=900, WARN=60, FIGHT=180, HP_PER=1750;
const REWARD={all:0.01,top:[0.2,0.1,0.1]};
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const ton=v=>fa((+v.toFixed(2)).toString().replace(".","٫"))+" TON";
let phase="wait", left=INTERVAL, fightLeft=FIGHT, hp=0, maxHp=0, dmg={}, taps={}, lastHit=null, rage=false;
let shield=false, shieldStart=0, shieldT, reaction={}, shieldHits={}, tapLog={}, PENALTY=150, RATE=8;
let lastList=0, combo=0, bestCombo=0, lastTap=0, comboT, botT=[], clockT, msgs=[], result=null, dirty=false, ticker="";

function avatar(u){return `<div class="ava" style="background:linear-gradient(135deg,${u.color},#1b1e2e)">${u.ini}</div>`}
function mmss(s){return fa(Math.floor(s/60)+":"+String(s%60).padStart(2,"0"))}
function say(who,t,bot){msgs.push({who,t,bot});if(msgs.length>40)msgs.shift();renderChat()}
const name=id=>USERS.find(u=>u.id===id).name;
const fmt=n=>n.toLocaleString("fa-IR");

setInterval(()=>{
  if(phase==="fight"||phase==="intro")return;
  left--;
  if(phase==="wait"&&left<=WARN){phase="warn";say(BOT,"👹 یک باس تا ۱ دقیقه‌ی دیگر ظاهر می‌شود! آماده‌ی نبرد گروهی باشید.",true);}
  if(left<=0)startIntro();
  renderHead();if(phase!=="intro")renderBody();
},1000);

function openView(){$("chatBody").classList.add("hidden");$("bossView").classList.remove("hidden");renderHead();renderBody()}
function closeView(){if(phase==="fight"||phase==="intro")return;$("bossView").classList.add("hidden");$("chatBody").classList.remove("hidden");renderChat()}

function startIntro(){
  phase="intro";result=null;showTab("chat");openView();
  maxHp=hp=USERS.length*HP_PER;dmg={};taps={};USERS.forEach(u=>{dmg[u.id]=0;taps[u.id]=0});
  lastHit=null;rage=false;combo=0;bestCombo=0;ticker="";
  renderHead();renderFightShell();
  let n=3;const tick=()=>{banner(n>0?fa(n):"بجنگید!",n>0);if(n-->0)setTimeout(tick,800);else setTimeout(startFight,500)};tick();
}
function startFight(){
  phase="fight";fightLeft=FIGHT;
  say(BOT,`👹 زامبی اره‌برقی با ${fmt(maxHp)} جان آمد! تا می‌توانید سریع ضربه بزنید — ۳ دقیقه!`,true);
  shield=false;shieldHits={};tapLog={};USERS.forEach(u=>shieldHits[u.id]=0);
  USERS.filter(u=>!u.me).forEach(botLoop);
  scheduleShield(12000+Math.random()*6000);
  clockT=setInterval(()=>{fightLeft--;if(fightLeft<=0)endFight(false);else{renderHead();updateRing()}},1000);
  renderHead();updateRing();loop();
}
function botLoop(u){
  if(u.auto){ // perfectly regular, never stops — like an auto clicker
    const t=setTimeout(()=>{if(phase!=="fight")return;hit(u.id);botLoop(u)},125);botT.push(t);return;
  }
  const burst=Math.random()<.12;
  const t=setTimeout(()=>{
    if(phase!=="fight")return;
    // humans notice the shield after their reaction time and stop
    if(!(shield&&performance.now()-shieldStart>reaction[u.id]))hit(u.id);
    botLoop(u);
  },burst?900+Math.random()*1500:140+Math.random()*260);
  botT.push(t);
}
function scheduleShield(ms){
  clearTimeout(shieldT);
  shieldT=setTimeout(()=>{
    if(phase!=="fight")return;
    shield=true;shieldStart=performance.now();
    USERS.forEach(u=>reaction[u.id]=250+Math.random()*450);
    banner("🛡️ سپر!",false);ticker="🛡️ سپر فعال شد — ضربه نزنید وگرنه امتیاز از دست می‌دهید!";dirty=true;
    const len=2000+Math.random()*1200;
    shieldT=setTimeout(()=>{
      if(phase!=="fight")return;
      shield=false;ticker="⚔️ سپر برداشته شد — حمله کنید!";dirty=true;
      if(shieldHits.auto>0)setTimeout(()=>{if(phase==="fight"){ticker=`🤖 AutoClicker_Bot مدام به سپر ضربه زد (مجموع −${fmt(shieldHits.auto*PENALTY)})`;dirty=true}},1200);
      scheduleShield(9000+Math.random()*7000);
    },len);
  },ms);
}
function roll(isMe){
  const x=Math.random();
  if(x<.06)return{d:0,type:"blk"};
  let d=3+Math.floor(Math.random()*6);
  if(isMe&&combo>=20)d=Math.round(d*1.5);
  if(x>.93)return{d:d*3,type:"crit"};
  return{d,type:""};
}
function hit(uid,px,py){
  if(phase!=="fight")return;
  const isMe=uid==="me";
  // server-side rate limit: max RATE taps per second count
  const now=performance.now();const log=(tapLog[uid]=(tapLog[uid]||[]).filter(t=>now-t<1000));
  if(log.length>=RATE)return;log.push(now);
  if(shield){
    const p=Math.min(PENALTY,dmg[uid]);dmg[uid]-=p;shieldHits[uid]++;
    if(isMe||uid==="auto"||Math.random()<.3)showNum("−"+fa(PENALTY)+" 🛡️","pen",px,py);
    dirty=true;return;
  }
  let {d,type}=roll(isMe);
  if(rage)d=Math.max(type==="blk"?0:1,Math.round(d*.7));
  d=Math.min(d,hp);hp-=d;dmg[uid]+=d;taps[uid]++;
  if(d>0)lastHit=uid;
  if(isMe||type==="crit"||Math.random()<.12)showNum(type==="blk"?"دفع":(type==="crit"?"⚡"+fa(d):"-"+fa(d)),type||(isMe?"me":"other"),px,py);
  if(type==="crit"&&!isMe)ticker=`⚡ ضربه‌ی بحرانی ${name(uid)}: ${fa(d)}!`;
  if(type==="crit"&&isMe)ticker=`⚡ ضربه‌ی بحرانی شما: ${fa(d)}!`;
  if(!rage&&hp<=maxHp*.25&&hp>0){rage=true;banner("خشمگین!",false);ticker="😡 باس خشمگین شد — آسیب کمتر می‌شود!";say(BOT,"😡 باس در ۲۵٪ جان خشمگین شد! ادامه دهید!",true);}
  dirty=true;
  if(hp<=0)endFight(true);
}
function myTap(e){
  if(phase!=="fight")return;
  const now=performance.now();
  combo=shield?0:((now-lastTap<600)?combo+1:1);lastTap=now;bestCombo=Math.max(bestCombo,combo);
  clearTimeout(comboT);comboT=setTimeout(()=>{combo=0;dirty=true},650);
  const st=$("stage").getBoundingClientRect();
  let px=st.width/2+(Math.random()*80-40),py=st.height/2+(Math.random()*40-30);
  if(e&&e.currentTarget===$("stage")&&e.clientX){px=e.clientX-st.left;py=e.clientY-st.top}
  hit("me",px,py);
  if(!shield)slashFx(px,py);
  const b=$("bsvg");if(b){b.classList.add("hurt");setTimeout(()=>b.classList.remove("hurt"),70)}
  const a=$("arena");if(a){a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake")}
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
}
function slashFx(x,y){
  const st=$("stage");if(!st)return;
  const sl=document.createElement("div");sl.className="slash";sl.style.left=x+"px";sl.style.top=y+"px";sl.style.setProperty("--r",(Math.random()*120-60)+"deg");
  st.appendChild(sl);setTimeout(()=>sl.remove(),230);
  for(let i=0;i<4;i++){const p=document.createElement("div");p.className="spark";p.style.left=x+"px";p.style.top=y+"px";
    const a=Math.random()*Math.PI*2,d=20+Math.random()*30;p.style.setProperty("--x",Math.cos(a)*d+"px");p.style.setProperty("--y",Math.sin(a)*d+"px");
    st.appendChild(p);setTimeout(()=>p.remove(),360);}
}
function ripple(e){
  const btn=e.currentTarget,r=btn.getBoundingClientRect(),el=document.createElement("span");
  const size=60;el.className="rip";el.style.width=el.style.height=size+"px";
  el.style.left=((e.clientX||r.left+r.width/2)-r.left-size/2)+"px";el.style.top=((e.clientY||r.top+r.height/2)-r.top-size/2)+"px";
  btn.appendChild(el);setTimeout(()=>el.remove(),450);
}
function showNum(t,cls,px,py){
  const st=$("stage");if(!st)return;
  const w=st.clientWidth,h=st.clientHeight;
  const el=document.createElement("div");el.className="num "+cls;el.textContent=t;
  el.style.left=(px??(w*.2+Math.random()*w*.6))+"px";el.style.top=(py??(h*.25+Math.random()*h*.4))+"px";
  st.appendChild(el);setTimeout(()=>el.remove(),800);
}
function banner(t,isCount){
  const b=$("banner");if(!b)return;
  b.innerHTML=`<div class="${isCount?"count":""}">${t}</div>`;
}
function ranking(){return Object.entries(dmg).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1])}

function renderFightShell(){
  $("body").innerHTML=`
  <div class="arena" id="arena">
    <div class="top">
      <div class="bossname"><small>باس جهانی · سطح ۹۹</small>زامبی اره‌برقی</div>
      <div class="ring" id="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="22" fill="none" stroke="#2a2e47" stroke-width="5"/><circle id="ringc" cx="26" cy="26" r="22" fill="none" stroke="#ffc61a" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg><b id="ringt">۳:۰۰</b></div>
    </div>
    <div class="hpwrap">
      <div class="hpbar"><i class="trail" id="trail" style="width:100%"></i><i class="fill" id="fill" style="width:100%"></i><i class="seg"></i></div>
      <div class="hpmeta"><span id="hptxt"></span><span id="hppct"></span></div>
    </div>
    <div class="stage" id="stage">${BOSS_SVG}
      <div class="combo" id="combo"><b id="combon">×۰</b><span>کمبو</span></div>
      <div class="floor"></div><div class="shieldfx"></div><div class="vignette"></div><div class="banner" id="banner"></div>
    </div>
    <div class="ticker" id="ticker"></div>
  </div>
  <button class="tapbtn" id="tap">⚔️ برای حمله ضربه بزنید<small>تا می‌توانید سریع بزنید · کمبو ۲۰+ = ۱٫۵ برابر · هرگز به 🛡️ سپر نزنید</small></button>
  <div class="mystats">
    <div><b id="sDmg">0</b><span>آسیب شما</span></div>
    <div><b id="sRank">–</b><span>رتبه‌ی شما</span></div>
    <div><b id="sShield">0</b><span>ضربه به سپر</span></div>
  </div>
  <div class="lb"><h5>بیشترین آسیب · زنده</h5><div id="lb"></div></div>`;
  const tap=$("tap");
  tap.addEventListener("pointerdown",e=>{e.preventDefault();ripple(e);myTap(e)});
  $("stage").addEventListener("pointerdown",e=>{e.preventDefault();myTap(e)});
  dirty=true;draw();
}
function updateRing(){
  const c=$("ringc"),t=$("ringt");if(!c)return;
  c.setAttribute("stroke-dashoffset",138.2*(1-fightLeft/FIGHT));
  c.setAttribute("stroke",fightLeft<=20?"#ff2d55":"#ffc61a");
  t.textContent=mmss(fightLeft);$("ring").classList.toggle("low",fightLeft<=20);
}
function loop(){if(phase!=="fight")return;if(dirty)draw();requestAnimationFrame(loop)}
function draw(){
  dirty=false;if(!$("fill"))return;
  const pct=hp/maxHp*100;
  $("fill").style.width=pct+"%";$("trail").style.width=pct+"%";
  $("hptxt").textContent=`${fmt(hp)} / ${fmt(maxHp)} جان`;$("hppct").textContent=fa(pct.toFixed(1)).replace(".","٫")+"٪";
  $("arena").classList.toggle("rage",rage);$("arena").classList.toggle("shielded",shield);
  const tb=$("tap");tb.classList.toggle("shieldbtn",shield);tb.firstChild.textContent=shield?"🛡️ سپر — ضربه نزنید!":"⚔️ برای حمله ضربه بزنید";
  $("sShield").textContent=fa(shieldHits.me||0);
  const cb=$("combo");cb.classList.toggle("on",combo>=3);cb.classList.toggle("hot",combo>=20);$("combon").textContent="×"+fa(combo);
  $("ticker").textContent=ticker;
  const r=ranking(),pos=r.findIndex(e=>e[0]==="me")+1,top=r.length?r[0][1]:1;
  $("sDmg").textContent=fmt(dmg.me||0);$("sRank").textContent=pos?"#"+fa(pos):"–";
  let rows=r.slice(0,5);
  if(pos>5)rows=rows.slice(0,4).concat([r[pos-1]]);
  $("lb").innerHTML=rows.map(e=>{const i=r.indexOf(e);return `<div class="lbr ${e[0]==="me"?"me":""}"><span>${["🥇","🥈","🥉"][i]||"#"+fa(i+1)}</span><span>${e[0]==="me"?"شما":name(e[0])}${shieldHits[e[0]]>10?' <span class="auto">⚠️ سپر</span>':""}</span><b>${fmt(e[1])}</b><div class="bar"><i style="width:${e[1]/top*100}%"></i></div></div>`}).join("")||'<div class="lbr"><span></span><span style="color:var(--muted)">هنوز ضربه‌ای نیست</span></div>';
  if(phase==="fight"&&performance.now()-lastList>600){lastList=performance.now();renderList();}
}
function endFight(won){
  if(phase!=="fight")return;
  phase="wait";left=INTERVAL;clearInterval(clockT);clearTimeout(shieldT);shield=false;botT.forEach(clearTimeout);botT=[];
  const r=ranking();result={won,r,last:won?lastHit:null};
  if(won){
    const top=r.slice(0,3).map((e,i)=>`${name(e[0])} (+${ton(REWARD.top[i])})`).join(", ");
    say(BOT,`🎉 باس شکست خورد! بیشترین آسیب: ${top}. بقیه‌ی مبارزان ${ton(REWARD.all)} دریافت می‌کنند.`,true);
  }else say(BOT,"💀 زمان تمام شد — باس فرار کرد! این بار جایزه‌ای نیست.",true);
  draw();banner(won?"پیروزی!":"شکست",false);
  setTimeout(()=>{renderHead();renderBody();renderList()},1500);
  setTimeout(closeView,10000);
}

function renderHead(){
  const b=$("bossBtn"),f=phase==="fight"||phase==="intro";
  b.classList.toggle("live",f);b.classList.toggle("soon",phase==="warn");
  b.textContent=f?"👹 نبرد":"👹 "+mmss(left);
  $("paused").style.display=f?"":"none";$("backBtn").style.display=f?"none":"";
}
function renderBody(){
  if(phase==="fight"||phase==="intro")return;
  if(result){
    const {won,r,last}=result,myPos=r.findIndex(e=>e[0]==="me");
    let mine=0;if(won&&dmg.me>0)mine=myPos>=0&&myPos<3?REWARD.top[myPos]:REWARD.all;
    $("body").innerHTML=`<div class="arena ${won?"dead":"rage"}"><div class="stage" style="height:230px">${BOSS_SVG}</div></div>
      <div class="res"><h3>${won?"🎉 باس شکست خورد!":"💀 باس فرار کرد"}</h3>
      <p>${won?`${fa(r.length)} مبارز · ${fmt(maxHp)} آسیب در ${mmss(FIGHT-fightLeft)}`:`${fmt(maxHp-hp)} از ${fmt(maxHp)} جان کم شد — کافی نبود`}</p>
      ${won?`<div class="rw">${r.slice(0,3).map((e,i)=>`<div><span>${["🥇","🥈","🥉"][i]} ${e[0]==="me"?"شما":name(e[0])} · ${fmt(e[1])}</span><b>+${ton(REWARD.top[i])}</b></div>`).join("")}
        <div><span>👥 بقیه‌ی مبارزان (${fa(Math.max(0,r.length-3))})</span><b>+${ton(REWARD.all)}</b></div></div>
        <div class="mine ${mine?"":"none"}">${mine?`شما +${ton(mine)} دریافت کردید`:"این بار حمله نکردید"}</div>`:""}
      ${(()=>{const i=r.findIndex(e=>e[0]==="auto");const sh=shieldHits.auto||0;return sh?`<p style="margin-top:10px">🤖 AutoClicker_Bot: ${fa(sh)} ضربه به سپر (−${fmt(sh*PENALTY)}) · ${i>=0?"رتبه‌ی "+fa(i+1)+" از "+fa(USERS.length):"آسیب صفر"}</p>`:""})()}
      <p style="margin-top:12px">باس بعدی تا <b>${mmss(left)}</b></p>
      <button class="skip" id="skip">دمو: باس را همین حالا بیاور</button></div>`;
  }else{
    $("body").innerHTML=`<div class="arena"><div class="stage" style="height:230px;opacity:.35">${BOSS_SVG}</div></div>
      <div class="wait"><b>${mmss(left)}</b>${phase==="warn"?"باس در راه است — آنلاین بمانید!":"تا باس جهانی بعدی · همه‌ی کاربران آنلاین با هم می‌جنگند"}<br>
      <button class="skip" id="skip">دمو: باس را همین حالا بیاور</button></div>`;
  }
  $("skip").onclick=startIntro;
}
function renderList(){
  $("cnt").textContent=fa(USERS.length);
  const r=result&&result.won?result.r:[];
  $("list").innerHTML=USERS.map(u=>{
    let tag="",st=u.st;
    if(phase==="fight"){tag=`<span class="racing">⚔️ ${fmt(dmg[u.id]||0)}</span>`;st="⚔️ در حال نبرد با باس";}
    else if(r.length&&r[0][0]===u.id)tag=`<span class="won">👑 +${ton(REWARD.top[0])}</span>`;
    else if(r.length>1&&r[1][0]===u.id||r.length>2&&r[2][0]===u.id)tag=`<span class="won">🏅 +${ton(REWARD.top[1])}</span>`;
    return `<div class="row">${avatar(u)}<div class="rinfo">
      <div class="rname"><span>${u.name}</span><span class="lv">${u.me?"شما":"سطح "+fa(u.lv)}</span></div>
      <div class="rstat">${st}</div></div><div class="tag">${tag}</div></div>`;
  }).join("");
}
function renderChat(){
  const el=$("msgs");
  el.innerHTML=msgs.map(m=>{const u=USERS.find(x=>x.name===m.who);
    return `<div class="msg">${m.bot||!u?`<div class="ava" style="background:linear-gradient(135deg,#ff6b6b,#7a1020)">👹</div>`:avatar(u)}
      <div class="bubble ${m.bot?"bot":""}"><div class="who">${m.who}</div><div class="t">${m.t}</div></div></div>`}).join("");
  el.scrollTop=el.scrollHeight;
}
function showTab(n){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===n));
  $("online").classList.toggle("hidden",n!=="online");$("chat").classList.toggle("hidden",n!=="chat");renderChat();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>showTab(t.dataset.tab));
$("bossBtn").onclick=openView;$("backBtn").onclick=closeView;
say("Alireza_kh9090","سلام بچه‌ها 😂");
say("Mahsa","باس کی میاد؟ 👹");
say(BOT,"👹 باس جهانی: هر ۱۵ دقیقه یک باس ظاهر می‌شود. همه‌ی کاربران آنلاین با هم می‌جنگند — تا می‌توانید سریع ضربه بزنید و در ۳ دقیقه شکستش دهید! 🥇 ۰٫۲ TON · 🥈🥉 ۰٫۱ TON · بقیه ۰٫۰۱ TON",true);
renderHead();renderList();
</script>
